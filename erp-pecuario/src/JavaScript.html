    for (var i = 0; i < ordem.length; i++) {
      var m = ordem[i].re.exec(rota);
      if (m) {
        var params = {};
        ordem[i].nomes.forEach(function (n, k) { params[n] = m[k + 1] === undefined ? null : decodeURIComponent(m[k + 1]); });
        return { padrao: ordem[i].padrao, def: ordem[i].def, params: params };
      }
    }
    return null;
  }
  /** A rota abre uma tela: registrada, ou de um módulo sob demanda que ainda não veio do servidor (Modulos). */
  function existe(rota) {
    if (resolver(rota)) return true;
    var m = typeof Modulos !== 'undefined' ? Modulos.daRota(rota) : null;
    return !!m && !Modulos.carregado(m.tela);
  }
  return { registrar: registrar, resolver: resolver, existe: existe };
})();

/**
 * Telas carregadas sob demanda (01, seção 6.2; risco R-31). As das Fases 3 a 5 e a importação não entram na página inicial:
 * o módulo entregue que o servidor declara `sob_demanda` (catálogo: `tela`, `rotas`) é pedido por `sistema.tela` quando a
 * rota dele abre, injetado (o `<script>` da tela roda e registra as rotas com Telas.registrar) e guardado em memória, sem
 * novo pedido nesta página. O conteúdo vem compactado como o doGet entrega os includes; nada de innerHTML: o texto vira nó.
 */
var Modulos = (function () {
  var MSG_FALHA = 'A tela não pôde ser aberta. Recarregue a página; se continuar, avise o suporte.';
  var MSG_VERSAO = 'Há uma versão nova do app no servidor. Recarregue a página para abrir esta tela; o que você digitou fica guardado.';
  var carregados = {};
  var emCurso = {};
  function sobDemanda() { return Store.modulos().filter(function (m) { return m.sob_demanda === true && !!m.tela; }); }
  /** O módulo sob demanda dono da rota (pelo primeiro trecho dela), ou null. */
  function daRota(rota) {
    var raiz = String(rota || '').split('/')[0];
    if (!raiz) return null;
    return sobDemanda().filter(function (m) { return (m.rotas || []).indexOf(raiz) >= 0; })[0] || null;
  }
  function carregado(tela) { return carregados[tela] === true; }
  /** O include compactado em estilos e scripts. */
  function partes(html) {
    var out = { estilos: [], scripts: [] };
    var re = /<(style|script)>([\s\S]*?)<\/\1>/g;
    var m;
    while ((m = re.exec(String(html)))) (m[1] === 'style' ? out.estilos : out.scripts).push(m[2]);
    return out;
  }
  function versaoDaPagina_() {
    var raiz = document.getElementById('app');
    return raiz ? raiz.getAttribute('data-app-version') : null;
  }
  /** Põe a tela na página. O erro de execução do script dela chega pelo evento `error` da janela, na mesma hora. */
  function injetar_(tela, conteudo) {
    var p = partes(conteudo);
    if (!p.scripts.length) throw new Cliente.ErroApi('INTERNAL', MSG_FALHA, [], { causa: 'a tela ' + tela + ' veio sem script' });
    p.estilos.forEach(function (css) {
      var s = document.createElement('style');
      s.setAttribute('data-modulo', tela);
      s.textContent = css;
      document.head.appendChild(s);
    });
    var falha = null;
    function aoErro(ev) { if (!falha) falha = ev.error || new Error(ev.message); }
    window.addEventListener('error', aoErro);
    try {
      p.scripts.forEach(function (js) {
        var s = document.createElement('script');
        s.setAttribute('data-modulo', tela);
        s.text = js;
        document.body.appendChild(s);
      });
    } finally {
      window.removeEventListener('error', aoErro);
    }
    if (falha) throw new Cliente.ErroApi('INTERNAL', MSG_FALHA, [], { causa: String(falha && falha.message ? falha.message : falha) });
  }
  /**
   * Pede, injeta e guarda a tela. Promise: true quando veio agora, false quando já estava. Pedidos ao mesmo tempo da mesma
   * tela viram um só. Erro: Cliente.ErroApi (TRANSPORTE, SEM_RESPOSTA, NOT_FOUND; NOVA_VERSAO com `recarregar` quando o
   * servidor já tem outra versão do app, cuja tela não serve à página aberta; INTERNAL quando a tela não roda).
   */
  function carregar(tela) {
    if (carregados[tela]) return Promise.resolve(false);
    if (emCurso[tela]) return emCurso[tela];
    var p = Cliente.consulta('sistema.tela', { nome: tela }).then(function (r) {
      var d = r.data || {};
      if (d.nome !== tela || typeof d.conteudo !== 'string') throw new Cliente.ErroApi('INTERNAL', Cliente.MSG.RESPOSTA_ESTRANHA);
      var versao = versaoDaPagina_();
      if (r.meta && r.meta.appVersion && versao && r.meta.appVersion !== versao) throw new Cliente.ErroApi('NOVA_VERSAO', MSG_VERSAO, [], { recarregar: true });
      injetar_(tela, d.conteudo);
      carregados[tela] = true;
      return true;
    });
    emCurso[tela] = p;
    p.then(function () { delete emCurso[tela]; }, function () { delete emCurso[tela]; });
    return p;
  }
  return { daRota: daRota, carregado: carregado, carregar: carregar, sobDemanda: sobDemanda, partes: partes };
})();

var App = (function () {
  /** Os 10 itens da §15, na ordem dela; cada um aparece só se o módulo está ativo no servidor e a tela existe. */
  var MENU = [
    { modulo: 'DASHBOARD', rota: 'inicio', icone: 'inicio', curto: 'Início' },
    { modulo: 'REBANHO', rota: 'rebanho', icone: 'rebanho', curto: 'Rebanho' },
    { modulo: 'PASTOS', rota: 'pastos', icone: 'pasto', curto: 'Pastos' },
    { modulo: 'EVENTOS', rota: 'eventos', icone: 'eventos', curto: 'Eventos' },
    { modulo: 'PESAGENS', rota: 'pesagens', icone: 'peso', curto: 'Pesagens' },
    { modulo: 'SANIDADE', rota: 'sanidade/agenda', icone: 'sanidade', curto: 'Sanidade' },
    { modulo: 'REPRODUCAO', rota: 'reproducao/matrizes', icone: 'reproducao', curto: 'Reprodução' },
    { modulo: 'FINANCEIRO', rota: 'financeiro/lancamentos', icone: 'financeiro', curto: 'Financeiro' },
    { modulo: 'RELATORIOS', rota: 'relatorios', icone: 'relatorios', curto: 'Relatórios' },
    { modulo: 'CONFIGURACOES', rota: 'config/parametros', icone: 'config', curto: 'Configurações' },
  ];
  var ROTA_REGISTRAR = 'evento/novo';
  var cfg = { appVersion: null, ambiente: 'PRODUCAO', urlApp: '' };
  var montada = null, limpeza = null, iniciado = false, ultimaConferencia = 0, vezDaRota = 0;
  var el = {};

  function lerPagina_() {
    var raiz = document.getElementById('app');
    cfg.appVersion = raiz.getAttribute('data-app-version') || null;
    cfg.ambiente = raiz.getAttribute('data-ambiente') || 'PRODUCAO';
    cfg.urlApp = raiz.getAttribute('data-url-app') || '';
    ['topo', 'faixas', 'menu', 'conteudo', 'barra', 'camada', 'avisos'].forEach(function (id) { el[id] = document.getElementById(id); });
  }
  function itensMenu() {
    return MENU.map(function (m, i) {
      var mod = Store.modulo(m.modulo);
      if (!mod || mod.menu === false || !Telas.existe(m.rota)) return null;
      return { modulo: m.modulo, rota: m.rota, icone: m.icone, rotulo: mod.rotulo || m.curto, curto: m.curto, ordem: i + 1 };
    }).filter(Boolean);
  }
  function podeRegistrar() { return Telas.existe(ROTA_REGISTRAR) && (Store.catalogo().tipos || []).some(function (t) { return t.tipo !== 'ESTORNO'; }); }
  function rotaInicial_() { var m = itensMenu(); return m.length ? m[0].rota : ROTA_REGISTRAR; }

  function renderizarCasca_() {
    var h = Util.h;
    Util.limpar(el.topo);
    el.topo.appendChild(h('button', { type: 'button', class: 'botao botao-texto botao-icone topo-voltar', 'aria-label': 'Voltar', on: { click: function () { Roteador.voltar(rotaInicial_()); } } }, UI.icone('voltar')));
    el.topo.appendChild(h('div', { class: 'topo-marca' }, UI.icone('rebanho'), h('span', { text: 'ERP Pecuário' })));
    var acoes = h('div', { class: 'topo-acoes' });
    if (Telas.existe('animal/x/resumo')) acoes.appendChild(UI.buscaBrinco());
    if (podeRegistrar()) acoes.appendChild(h('a', { class: 'botao botao-primario', href: Roteador.href(ROTA_REGISTRAR), dataset: { rota: ROTA_REGISTRAR } }, UI.icone('registrar'), 'REGISTRAR EVENTO'));
    el.topo.appendChild(acoes);

    Util.limpar(el.menu);
    var ul = h('ul', { class: 'menu-lista' });
    itensMenu().forEach(function (m) {
      ul.appendChild(h('li', null, h('a', { class: 'menu-item', href: Roteador.href(m.rota), dataset: { rota: m.rota, modulo: m.modulo } }, UI.icone(m.icone), m.rotulo)));
    });
    el.menu.appendChild(ul);

    Util.limpar(el.barra);
    var itens = itensMenu();
    var porModulo = {};
    itens.forEach(function (m) { porModulo[m.modulo] = m; });
    var barra = [];
    if (porModulo.DASHBOARD) barra.push(itemBarra_(porModulo.DASHBOARD));
    if (porModulo.REBANHO) barra.push(itemBarra_(porModulo.REBANHO));
    if (podeRegistrar()) barra.push(h('a', { class: 'barra-item barra-registrar', href: Roteador.href(ROTA_REGISTRAR), dataset: { rota: ROTA_REGISTRAR } }, UI.icone('registrar'), 'Registrar'));
    if (porModulo.PASTOS) barra.push(itemBarra_(porModulo.PASTOS));
    var mais = itens.filter(function (m) { return m.ordem >= 4; });
    if (mais.length) barra.push(h('button', { type: 'button', class: 'barra-item', 'aria-haspopup': 'dialog', dataset: { mais: '1' }, on: { click: function (ev) { abrirMais_(mais, ev.currentTarget); } } }, UI.icone('mais'), 'Mais'));
    barra.forEach(function (b) { el.barra.appendChild(b); });
    el.barra.hidden = barra.length === 0;
    marcarAtual_();
  }
  function itemBarra_(m) {
    return Util.h('a', { class: 'barra-item', href: Roteador.href(m.rota), dataset: { rota: m.rota, modulo: m.modulo } }, UI.icone(m.icone), m.curto);
  }
  function abrirMais_(itens, origem) {
    var h = Util.h;
    var lista = h('ul', { class: 'menu-lista' });
    var folha;
    itens.forEach(function (m) {
      lista.appendChild(h('li', null, h('a', { class: 'menu-item', href: Roteador.href(m.rota), dataset: { rota: m.rota }, on: { click: function () { folha.fechar(); } } }, UI.icone(m.icone), m.rotulo)));
    });
    folha = UI.folha({ titulo: 'Mais', conteudo: lista, origem: origem });
  }
  function marcarAtual_() {
    var r = Roteador.atual();
    var raiz = r.split('/')[0];
    [el.menu, el.barra, el.topo].forEach(function (c) {
      if (!c) return;
      Array.prototype.forEach.call(c.querySelectorAll('[data-rota]'), function (a) {
        var alvo = a.getAttribute('data-rota');
        var ativo = alvo === r || (alvo.split('/')[0] === raiz && raiz !== 'evento') || (alvo === ROTA_REGISTRAR && r.indexOf(ROTA_REGISTRAR) === 0);
        if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
    });
  }
  function aoClicar_(ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var a = ev.target.closest ? ev.target.closest('a[data-rota]') : null;
    if (!a) return;
    ev.preventDefault();
    Roteador.ir(a.getAttribute('data-rota'));
  }

  function renderizarRota_(rota) {
    if (!rota) { Roteador.ir(rotaInicial_(), { substituir: true }); return; }
    vezDaRota += 1;
    var alvo = Telas.resolver(rota);
    // Rota de um módulo sob demanda que ainda não veio: pede a tela ao servidor e abre quando chegar.
    var sob = alvo ? null : Modulos.daRota(rota);
    if (sob && Modulos.carregado(sob.tela)) sob = null;
    if (typeof limpeza === 'function') {
      try { limpeza(); } catch (e) { Util.registrarFalha('ao sair da tela ' + montada, e); }
    }
    limpeza = null;
    UI.fecharTudo();
    Util.limpar(el.conteudo);
    document.body.classList.toggle('tela-cheia', !!(alvo && alvo.def.telaCheia));
    marcarAtual_();
    if (sob) { abrirSobDemanda_(rota, sob); return; }
    if (!alvo || (alvo.def.modulo && !Store.modulo(alvo.def.modulo))) {
      montada = null;
      el.conteudo.appendChild(Util.h('h1', { class: 'tela-titulo', text: alvo ? 'Ainda não disponível' : 'Tela não encontrada' }));
      el.conteudo.appendChild(UI.estadoErro({ code: 'NOT_FOUND', message: alvo ? 'Esta parte do sistema ainda não foi entregue.' : 'Esta tela não existe nesta versão do app.' }, { acao: { texto: 'Ir para o início', aoClicar: function () { Roteador.ir(rotaInicial_()); } } }));
      return;
    }
    montada = alvo.padrao;
    var caixa = Util.h('div', { class: 'tela', dataset: { tela: alvo.padrao } });
    el.conteudo.appendChild(caixa);
    try {
      limpeza = alvo.def.montar(caixa, alvo.params) || null;
    } catch (e) {
      Util.registrarFalha('ao abrir a tela ' + alvo.padrao, e);
      Util.limpar(caixa);
      caixa.appendChild(UI.estadoErro({ code: 'INTERNAL', message: 'A tela não pôde ser aberta. Recarregue a página; se continuar, avise o suporte.' }, { detalhe: String(e && e.message) }));
    }
    var titulo = caixa.querySelector('h1');
    if (titulo && iniciado) { titulo.setAttribute('tabindex', '-1'); titulo.classList.add('tela-titulo'); titulo.focus({ preventScroll: false }); }
    window.scrollTo(0, 0);
  }

  /**
   * A tela de um módulo sob demanda (Modulos): o esqueleto enquanto ela vem; chegando, a rota abre de novo, já com a tela
   * registrada (se o usuário não foi para outra rota no meio: a tela que veio fica guardada para a próxima vez). Sem rede,
   * o erro com "Tentar de novo"; com outra versão do app no servidor, "Recarregar a página".
   */
  function abrirSobDemanda_(rota, mod) {
    montada = null;
    var vez = vezDaRota;
    var caixa = Util.h('div', { class: 'tela', dataset: { telaSobDemanda: mod.tela } }, UI.carregando('Abrindo ' + mod.rotulo + '…'));
    el.conteudo.appendChild(caixa);
    Modulos.carregar(mod.tela).then(function () {
      if (vez === vezDaRota) renderizarRota_(rota);
    }, function (e) {
      if (vez !== vezDaRota) return;
      if (e.code === 'INTERNAL') Util.registrarFalha('ao carregar a tela ' + mod.tela, e.causa || e);
      Util.limpar(caixa);
      var titulo = Util.h('h1', { class: 'tela-titulo', tabindex: '-1', text: 'Não foi possível abrir ' + mod.rotulo });
      caixa.appendChild(titulo);
      caixa.appendChild(UI.estadoErro(e, { acao: e.recarregar ? acaoRecarregar('Recarregar a página') : { texto: 'Tentar de novo', aoClicar: function () { renderizarRota_(rota); } } }));
      if (iniciado) titulo.focus();
    });
  }

  // ------------------------------------------------------------------ faixas ----
  /** Faixa persistente no alto (id único; repetir o id substitui). def: {tipo: info|aviso|erro|ok|teste, texto, acoes: [{texto, aoClicar, href}]}. */
  function faixa(id, def) {
    removerFaixa(id);
    var f = UI.faixa(def);
    f.setAttribute('data-faixa', id);
    if (def.tipo === 'teste') el.faixas.insertBefore(f, el.faixas.firstChild);
    else el.faixas.appendChild(f);
    return f;
  }
  function removerFaixa(id) {
    var f = el.faixas && el.faixas.querySelector('[data-faixa="' + id + '"]');
    if (f) f.parentNode.removeChild(f);
  }
  function temFaixa(id) { return !!(el.faixas && el.faixas.querySelector('[data-faixa="' + id + '"]')); }
  /** Recarregar a janela inteira: link para o app (target=_top) quando o endereço é conhecido; senão o próprio quadro. */
  function acaoRecarregar(texto) {
    if (cfg.urlApp) return { texto: texto, href: cfg.urlApp, alvo: '_top' };
    return { texto: texto, aoClicar: function () { location.reload(); } };
  }
  function faixasDoSistema_() {
    var amb = Store.ambiente();
    if (amb.base_de_teste) faixa('base-teste', { tipo: 'teste', texto: (amb.faixa || 'BASE DE TESTE') + ' — estes dados não são os da fazenda' });
    else removerFaixa('base-teste');
    var imp = (Store.alertas().alertas || []).filter(function (a) { return a.codigo === 'IMPORTACAO_INCOMPLETA'; })[0];
    if (imp) faixa('importacao', { tipo: 'erro', texto: imp.mensagem + ' Os registros ficam bloqueados até terminar ou desfazer.', acoes: Telas.existe('importar/x') ? [{ texto: 'Ver importação', aoClicar: function () { Roteador.ir('importar/' + (imp.ids && imp.ids[0] ? imp.ids[0] : '')); } }] : [] });
    else removerFaixa('importacao');
  }
  function novaVersao_() {
    if (temFaixa('nova-versao')) return;
    faixa('nova-versao', { tipo: 'info', texto: 'Nova versão disponível. O que você digitou fica guardado.', acoes: [acaoRecarregar('Recarregar')] });
  }
  async function conferirVersao_() {
    if (document.visibilityState !== 'visible' || !Store.carregado()) return;
    if (Fmt.agoraMs() - ultimaConferencia < 60000) return;
    ultimaConferencia = Fmt.agoraMs();
    try {
      var r = await Store.carregar();
      removerFaixa('sem-conexao');
      if (r.fonte === 'SERVIDOR') { renderizarCasca_(); faixasDoSistema_(); }
    } catch (e) {
      faixa('sem-conexao', { tipo: 'aviso', texto: 'Sem conexão com o servidor. Os dados na tela são de ' + Fmt.instante(new Date(Store.atualizadoEm()).toISOString()) + '.', acoes: [{ texto: 'Tentar de novo', aoClicar: function () { ultimaConferencia = 0; conferirVersao_(); } }] });
    }
  }

  async function carregarInicial_() {
    Util.limpar(el.conteudo);
    el.conteudo.appendChild(UI.carregando('Carregando o rebanho…'));
    try {
      await Store.carregar({ aoEstado: function (s) { if (s.estado === 'OCUPADO') { Util.limpar(el.conteudo); el.conteudo.appendChild(UI.carregando('Sistema ocupado, tentando de novo (' + s.tentativa + ' de ' + s.de + ')…')); } } });
      return true;
    } catch (e) {
      Util.limpar(el.conteudo);
      var acao = e.code === 'DENIED' || e.repetida ? acaoRecarregar('Entrar de novo') : { texto: 'Tentar de novo', aoClicar: function () { carregarInicial_().then(function (ok) { if (ok) continuar_(); }); } };
      el.conteudo.appendChild(UI.estadoErro(e, { acao: acao }));
      return false;
    }
  }
  function continuar_() {
    renderizarCasca_();
    faixasDoSistema_();
    return Roteador.iniciar(renderizarRota_).then(function (rota) {
      renderizarRota_(rota);
      iniciado = true;
      if (typeof Registro !== 'undefined' && Registro.conferirPendentes) Registro.conferirPendentes();
    });
  }
  /** Ponto de entrada (fim do Index): configura, carrega o store, monta a casca e a rota. */
  async function iniciar() {
    lerPagina_();
    Fmt.configurar({});
    Cliente.configurar({ ambiente: cfg.ambiente, appVersion: cfg.appVersion, aoNovaVersao: novaVersao_ });
    Store.configurar({ ambiente: cfg.ambiente, appVersion: cfg.appVersion });
    Rascunhos.iniciar({ ambiente: cfg.ambiente });
    document.addEventListener('click', aoClicar_);
    document.addEventListener('visibilitychange', conferirVersao_);
    var pular = document.getElementById('pular');
    if (pular) pular.addEventListener('click', function () { var t = el.conteudo.querySelector('h1') || el.conteudo; t.setAttribute('tabindex', '-1'); t.focus(); });
    ultimaConferencia = Fmt.agoraMs();
    if (await carregarInicial_()) await continuar_();
  }
  return {
    iniciar: iniciar, faixa: faixa, removerFaixa: removerFaixa, temFaixa: temFaixa, itensMenu: itensMenu, podeRegistrar: podeRegistrar,
    acaoRecarregar: acaoRecarregar, recasca: function () { renderizarCasca_(); faixasDoSistema_(); },
    rotaInicial: rotaInicial_, MENU: MENU, ROTA_REGISTRAR: ROTA_REGISTRAR,
    camada: function () { return el.camada; }, regiaoAvisos: function () { return el.avisos; }, raiz: function () { return document.getElementById('app'); },
  };
})();
</script>
