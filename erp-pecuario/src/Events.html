<script>
'use strict';
/*
 * ERP Pecuário — Eventos (08-ux-ui.md, seções 3 e 4). Histórico (evento.listar, paginado no servidor, com filtros de
 * tipo, período e "só os que valem", e os registros não concluídos deste aparelho); detalhe (evento.obter: animais,
 * detalhes, avisos aceitos, justificativa, o que ele substitui ou estorna, quem o anulou e os documentos e fotos do
 * lançamento e dos lançamentos financeiros dele — anexar e remover com justificativa); "Estornar" (ESTORNO pelo
 * fluxo de registro, com a simulação do servidor) e "Corrigir" (evento substituto do mesmo tipo, com os mesmos
 * animais, simulação e a diferença para o original). O registro em si (seletor, formulário, revisão, resultado) é o
 * do Registro (Components); as entradas por contexto ficam na ficha, no painel do pasto e na listagem.
 */
var TelaEventos = (function () {
  var REPRODUTIVOS = ['REPRODUCAO', 'DESMAMA', 'CASTRACAO', 'OCORRENCIA'];
  var h = Util.h;
  /** Corrigir (evento substituto) vale para todo tipo e subtipo ativo, menos o ESTORNO (E2.7; RN-043). */
  function corrigivel(ev) {
    var def = Store.tipoEvento(ev.event_type);
    return !!def && ev.event_type !== 'ESTORNO' && (!def.subtipos || !!(ev.event_subtype && def.subtipos[ev.event_subtype]));
  }
  var filtros = { tipo: '', de: '', ate: '', vigentes: false, pagina: 1 };
  function situacao(e) {
    if (e.event_type === 'ESTORNO') return 'Estorno';
    if (e.vigente) return 'Vale';
    if (e.anulado_por) return 'Não vale (estornado ou corrigido)';
    return Fmt.rotulo('STATUS_EVENTO', e.status);
  }
  function rotuloEvento(e) { return (e.rotulo || Fmt.rotulo('', e.event_type)) + ' de ' + Fmt.data(e.event_date) + (e.animais ? ' (' + e.animais + (e.animais === 1 ? ' animal)' : ' animais)') : ''); }
  function linkEvento(id, texto) { var r = 'evento/' + id; return h('a', { class: 'botao botao-texto', href: Roteador.href(r), dataset: { rota: r } }, texto); }
  function montarLista(el) {
    var vivo = true;
    el.appendChild(h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Eventos' }), App.podeRegistrar() ? h('a', { class: 'botao botao-primario', href: Roteador.href('evento/novo'), dataset: { rota: 'evento/novo' } }, 'Registrar evento') : null));
    var pend = h('div');
    el.appendChild(pend);
    Rascunhos.listar().then(function (rs) {
      var abertos = rs.filter(function (r) { return Store.tipoEvento(r.tipo); });
      if (!vivo || !abertos.length) return;
      pend.appendChild(UI.secao('Não concluídos neste aparelho', h('ul', { class: 'lista-simples' }, abertos.map(function (r) {
        return h('li', { class: 'linha-acao' }, h('span', { text: Registro.descricaoRascunho(r) + (r.estado === 'ENVIANDO' ? ' · verificando se gravou' : '') }), h('a', { class: 'botao botao-secundario', href: Roteador.href('evento/novo/' + r.tipo), dataset: { rota: 'evento/novo/' + r.tipo } }, 'Continuar'));
      })), { dado: 'nao-concluidos' }));
    }, function (e) { pend.appendChild(UI.nota('Não foi possível ler os rascunhos: ' + e.message, 'aviso')); });
    var tipos = [['', 'Todos']].concat((Store.catalogo().tipos || []).map(function (t) { return [t.tipo, t.rotulo]; }));
    var sel = h('select', { id: 'ev-tipo' }, tipos.map(function (t) { return h('option', { value: t[0], text: t[1], selected: t[0] === filtros.tipo }); }));
    var de = h('input', { type: 'date', id: 'ev-de', value: filtros.de });
    var ate = h('input', { type: 'date', id: 'ev-ate', value: filtros.ate });
    var vig = h('input', { type: 'checkbox', id: 'ev-vig', checked: filtros.vigentes });
    var campo = function (id, rot, c) { return h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: id, text: rot }), c); };
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Filtrar eventos', on: { submit: function (ev) { ev.preventDefault(); filtros.pagina = 1; carregar(); } } },
      campo('ev-tipo', 'Tipo', sel), campo('ev-de', 'De', de), campo('ev-ate', 'Até', ate),
      h('label', { class: 'marca', for: 'ev-vig' }, vig, h('span', { text: 'Só os que valem' })), UI.botao('Filtrar', { tipo: 'primario', atributos: { type: 'submit' } })));
    var resumo = h('p', { class: 'dado', role: 'status' });
    var corpo = h('div');
    el.appendChild(resumo);
    el.appendChild(corpo);
    async function carregar() {
      filtros.tipo = sel.value; filtros.de = de.value; filtros.ate = ate.value; filtros.vigentes = vig.checked;
      Util.limpar(corpo);
      corpo.appendChild(UI.carregando('Buscando os lançamentos…'));
      try {
        var q = { pagina: filtros.pagina };
        ['tipo', 'de', 'ate'].forEach(function (k) { if (filtros[k]) q[k] = filtros[k]; });
        if (filtros.vigentes) q.vigentes = true;
        var r = (await Cliente.consulta('evento.listar', q)).data;
        if (!vivo) return;
        Util.limpar(corpo);
        var paginas = Math.max(1, Math.ceil(r.total / r.por_pagina));
        resumo.textContent = r.total + (r.total === 1 ? ' lançamento' : ' lançamentos');
        corpo.appendChild(UI.tabela({
          id: 'eventos', rotulo: 'Lançamentos', linhas: r.itens, chave: function (e) { return e.event_id; }, porPagina: r.por_pagina, semPaginacao: true, vazio: { texto: 'Nenhum lançamento com esses filtros.' },
          colunas: [
            { id: 'event_date', rotulo: 'Data', formatar: function (e) { return Fmt.data(e.event_date); } },
            { id: 'rotulo', rotulo: 'Lançamento', formatar: function (e) { return linkEvento(e.event_id, e.rotulo + (e.event_subtype ? ' · ' + (e.rotulo_subtipo || Fmt.rotulo('', e.event_subtype)) : '')); } },
            { id: 'animais', rotulo: 'Animais', num: true },
            { id: 'total_value', rotulo: 'Valor', num: true, formatar: function (e) { return Fmt.dinheiro(e.total_value); } },
            { id: 'situacao', rotulo: 'Situação', valor: situacao },
            { id: 'source', rotulo: 'Origem', valor: function (e) { return Fmt.rotulo('FONTE', e.source); } },
          ],
        }).el);
        if (paginas > 1) {
          corpo.appendChild(h('div', { class: 'paginacao' }, h('span', { class: 'suave', text: 'Página ' + r.pagina + ' de ' + paginas }), h('div', { class: 'acoes', style: 'margin-top:0' },
            UI.botao('Anterior', { desabilitado: r.pagina <= 1, aoClicar: function () { filtros.pagina -= 1; carregar(); } }),
            UI.botao('Próxima', { desabilitado: r.pagina >= paginas, aoClicar: function () { filtros.pagina += 1; carregar(); } }))));
        }
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
      }
    }
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ correção ----
  /**
   * O valor da entrada sem mudança do servidor (evento.obter: correcao, CONTRATOS, seção 50) como o formulário o mostra, pelo
   * tipo do campo: dinheiro em reais, peso com uma casa, decimal e inteiro em texto; o resto como veio. A tela não calcula nada:
   * o que fica vazio (o que o servidor propôs) e o que vem digitado é decisão do servidor.
   */
  function paraForm_(d, v, corrigiveis, campo) {
    if (v === null || v === undefined || v === '') return null;
    if (corrigiveis) { var t = (corrigiveis[campo] || {}).tipo; return t === 'bool' ? v === 'S' : String(v); }
    if (!d) return v;
    if (d.tipo === 'dinheiro') return Fmt.centavosParaTexto(v);
    if (d.tipo === 'decimal' && d.casas === 1) return Fmt.numero(v, 1).replace(/\./g, '');
    if (d.tipo === 'decimal' || d.tipo === 'inteiro') return String(v).replace('.', ',');
    return v;
  }
  function valoresForm_(defs, obj, corrigiveis) {
    var por = {};
    (defs || []).forEach(function (d) { por[d.id] = d; });
    var out = {};
    Object.keys(obj || {}).forEach(function (k) {
      if (k === 'animal_id') return;
      var v = paraForm_(por[k], obj[k], k === 'valor_novo' ? corrigiveis : null, obj.campo);
      if (v !== null && v !== undefined) out[k] = v;
    });
    return out;
  }
  /**
   * Prévia da correção: a entrada sem mudança que o servidor monta do evento gravado (Correcao.entrada), nos valores do
   * formulário, com os documentos e fotos do original (evento.obter: anexos), que passam ao substituto: o formulário e a revisão
   * dizem isso, para ninguém anexar de novo achando que se perderam (08, 4.4). null quando o evento não vale mais.
   */
  function previaCorrecao(o) {
    var ev = o.evento, c = o.correcao;
    if (!c) return null;
    var def = Store.tipoEvento(ev.event_type);
    var sub = c.subtipo || null;
    var sd = sub && def.subtipos ? def.subtipos[sub] : null;
    var corr = sd && sd.campos_corrigiveis;
    var campos = valoresForm_((def.campos || []).concat((sd && sd.campos) || []), c.campos);
    var antes = { campos: Util.clonar(campos), linhas: {} };
    var linhas = (c.animais || []).map(function (x) {
      var v = valoresForm_((sd && sd.campos_animal) || def.campos_animal, x, corr);
      if (!antes.linhas[x.animal_id]) antes.linhas[x.animal_id] = Util.clonar(v);
      return { animal_id: x.animal_id, criado: (c.criados || []).indexOf(x.animal_id) >= 0, valores: v };
    });
    if (corr) antes.itens = linhas.map(function (l) { return { animal_id: l.animal_id, valores: Util.clonar(l.valores) }; });
    var grupos = {};
    Object.keys(def.grupos_repetiveis || {}).forEach(function (g) {
      // O animal escolhido no grupo (a lista do rateio) é um campo dele; o da cria é o cadastro que a linha reaproveita.
      var comAnimal = def.grupos_repetiveis[g].some(function (d) { return d.id === 'animal_id'; });
      if (c[g]) grupos[g] = c[g].map(function (row) { var r = { valores: valoresForm_(def.grupos_repetiveis[g], row) }; if (row.animal_id && comAnimal) r.valores.animal_id = row.animal_id; else if (row.animal_id) r.animal_id = row.animal_id; return r; });
    });
    if (Object.keys(grupos).length) antes.grupos = Util.clonar(grupos);
    var rotulo = REPRODUTIVOS.indexOf(ev.event_type) >= 0 ? Store.nomeEvento(ev.event_type, sub) + ' de ' + Fmt.data(ev.event_date) : rotuloEvento(ev);
    var anexos = (o.anexos || []).filter(function (a) { return a.status === undefined || a.status === 'ATIVO'; }).map(function (a) { return a.nome_arquivo; });
    // O rateio corrige-se no mesmo lançamento (o servidor recusa outro): ele aparece pela descrição gravada do rateio.
    var rotulos = {};
    if (ev.event_type === 'RATEIO' && c.campos.financial_id) rotulos[c.campos.financial_id] = ev.description;
    return { subtipo: sub || undefined, campos: campos, linhas: linhas, grupos: grupos, rotulos: rotulos, origem: 'evento/' + ev.event_id, corrige: { event_id: ev.event_id, rotulo: rotulo, historico: ev.pre_marco_zero === true, antes: antes, anexos: anexos } };
  }
  var ROTULO_AJUSTE = { categoria_manual_id: 'Categoria', pasto_atual_id: 'Pasto', brinco: 'Brinco' };
  /** Valor gravado em AJUSTES (texto canônico) em palavras: categoria, pasto, mãe ou pai pelo nome; vazio = desconhecido. */
  function valorAjuste_(campo, v) { return Store.valorLegivel(campo, v); }
  /** Alocações de um rateio (o que coube a cada animal), com a base quando o critério é por peso. */
  function alocacoes_(det, rat, nome, cancelado) {
    var itens = (det.ALOCACOES_FINANCEIRAS || []).filter(function (x) { return x.rateio_id === rat.rateio_id; });
    if (!itens.length) return null;
    var porPeso = rat.criterio === 'PESO_VIVO' || rat.criterio === 'PESO_CARCACA';
    return h('details', { class: 'detalhe', dataset: { alocacoes: String(itens.length) } }, h('summary', { text: (cancelado ? 'Por animal, sem efeito (' : 'Por animal (') + itens.length + ')' }),
      h('ul', { class: 'lista-simples' }, itens.map(function (x) { return h('li', { dataset: { alocacao: String(x.valor_alocado) } }, h('span', { class: 'dado', text: nome(x.animal_id) }), ': ' + Fmt.dinheiro(x.valor_alocado) + (porPeso ? ' (base ' + Fmt.peso(x.base_valor) + ')' : '')); })));
  }

  // ------------------------------------------------------------------ detalhe ----
  function nomeAnimal(l) {
    var a = Store.animal(l.animal_id);
    return l.brinco || (a ? Store.rotuloAnimal(a) : l.codigo_interno || 'animal');
  }
  /**
   * Documentos e fotos do lançamento (evento.obter: anexos do evento e dos lançamentos financeiros dele): nota fiscal, GTA,
   * laudo, foto. Evento que vale recebe e perde arquivo (com justificativa); o estornado ou corrigido guarda os seus como
   * histórico (só abrir).
   */
  function blocoAnexos(ev, det, anexos) {
    var caixa = h('div');
    var recarregar = function () { Roteador.ir('evento/' + ev.event_id, { forcar: true, substituir: true }); };
    var nomeLanc = {};
    (det.FINANCEIRO || []).forEach(function (f) { nomeLanc[f.financial_id] = f.descricao || 'lançamento financeiro'; });
    var aceita = ev.vigente && ev.event_type !== 'ESTORNO';
    if (aceita) {
      caixa.appendChild(h('div', { class: 'acoes' }, UI.botao('Anexar nota fiscal, GTA, laudo ou foto', { tipo: 'primario', icone: 'registrar', aoClicar: function (evt) {
        Anexos.enviar({
          titulo: 'Arquivo do lançamento', origem: evt.currentTarget, entidade: 'EVENTOS', entity_id: ev.event_id, tipoPadrao: Anexos.tipoPadrao(ev.event_type), idBase: 'anx-ev',
          ligacoes: (det.FINANCEIRO || []).map(function (f) { return [f.financial_id, nomeLanc[f.financial_id] + ' (' + Fmt.dinheiro(f.valor) + ')']; }), aoSalvar: recarregar,
        });
      } })));
    } else if (anexos.length) caixa.appendChild(UI.nota(ev.event_type === 'ESTORNO' ? 'Os arquivos ficam no lançamento estornado.' : 'Este lançamento não vale mais: os arquivos dele ficam guardados como histórico.', 'info'));
    if (!anexos.length) { caixa.appendChild(UI.nota(aceita ? 'Nenhum arquivo neste lançamento.' : 'Nenhum arquivo.', 'info')); return caixa; }
    caixa.appendChild(Anexos.lista(anexos, {
      podeRemover: aceita, aoMudar: recarregar, aviso: 'O arquivo sai do lançamento e vai para a lixeira do Drive; o registro de que existiu fica na auditoria.',
      detalhe: function (x) { return x.financial_id ? 'de ' + (nomeLanc[x.financial_id] || 'um lançamento financeiro') : null; },
    }));
    return caixa;
  }
  function montarDetalhe(el, p) {
    var vivo = true;
    var titulo = h('h1', { text: 'Lançamento' });
    var acoes = h('div', { class: 'acoes', dataset: { acoesEvento: '1' } });
    var corpo = h('div', null, UI.carregando('Buscando o lançamento…'));
    el.appendChild(h('div', { class: 'tela-cabecalho' }, titulo));
    el.appendChild(acoes);
    el.appendChild(corpo);
    Cliente.consulta('evento.obter', { event_id: p.id }).then(function (r) {
      if (!vivo) return;
      var o = r.data, ev = o.evento, det = o.detalhes || {};
      titulo.textContent = ev.rotulo + (ev.event_subtype ? ' · ' + (ev.rotulo_subtipo || Fmt.rotulo('', ev.event_subtype)) : '');
      Util.limpar(corpo);
      var prop = Store.propriedade(ev.property_id);
      var payload = ev.payload || {};
      var ligacoes = [];
      if (o.anula) ligacoes.push([ev.event_type === 'ESTORNO' ? 'Estorna' : 'Substitui', linkEvento(o.anula.event_id, rotuloEvento(o.anula))]);
      if (ev.anulado_por) ligacoes.push(['Deixou de valer por', linkEvento(ev.anulado_por, 'ver o lançamento que o anulou')]);
      corpo.appendChild(UI.secao('Lançamento', UI.pares([
        ['Data', Fmt.data(ev.event_date)], ['Registrado em', Fmt.data(ev.registration_date)], ['Situação', situacao(ev)], ['Animais', String(ev.animais)],
        ['Propriedade', prop ? prop.nome : null], ['Descrição', ev.description], ['Responsável', ev.responsible], ['Observações', ev.notes],
        ['Valor', ev.total_value === null ? null : Fmt.dinheiro(ev.total_value)], ['Origem', Fmt.rotulo('FONTE', ev.source)], ['Lançado por', ev.created_by],
        ev.pre_marco_zero ? ['Histórico', 'antes do marco zero (sem efeito no inventário)'] : null, payload.justificativa ? ['Justificativa', payload.justificativa] : null,
      ].concat(ligacoes)), { dado: 'cabecalho' }));
      var aceitos = payload.avisos_aceitos || [];
      if (aceitos.length) corpo.appendChild(UI.secao('Avisos aceitos ao gravar', h('ul', { class: 'lista-simples' }, aceitos.map(function (a) { return h('li', { text: Fmt.rotulo('AVISO', a.codigo) + (a.n ? ' (' + a.n + ')' : '') + (a.justificativa ? ': ' + a.justificativa : '') }); })), { dado: 'avisos' }));
      var linhas = o.linhas || [];
      if (linhas.length) corpo.appendChild(UI.secao('Animais', UI.tabela({
        id: 'ev-animais', rotulo: 'Animais do lançamento', linhas: linhas, chave: function (l) { return l.event_animal_id; },
        colunas: [
          { id: 'animal', rotulo: 'Animal', valor: nomeAnimal, formatar: function (l) { var rr = 'animal/' + l.animal_id + '/resumo'; return h('a', { class: 'botao botao-texto', href: Roteador.href(rr), dataset: { rota: rr } }, nomeAnimal(l)); } },
          { id: 'papel', rotulo: 'Papel', valor: function (l) { return Fmt.rotulo('PAPEL', l.papel); } },
          { id: 'efeito', rotulo: 'No rebanho', valor: function (l) { var e = Number(l.efeito_inventario); return e > 0 ? 'entra' : e < 0 ? 'sai' : '—'; } },
          { id: 'pasto', rotulo: 'Pasto', valor: function (l) { var po = l.pasto_origem_id ? (Store.pasto(l.pasto_origem_id) || {}).nome : null, pd = l.pasto_destino_id ? (Store.pasto(l.pasto_destino_id) || {}).nome : null; return po && pd ? po + ' → ' + pd : pd || po || '—'; } },
          { id: 'peso', rotulo: 'Peso', num: true, formatar: function (l) { return Fmt.peso(l.peso); } },
          linhas.some(function (l) { return l.peso_carcaca_kg !== null && l.peso_carcaca_kg !== undefined; }) ? { id: 'carcaca', rotulo: 'Carcaça', num: true, formatar: function (l) { return Fmt.peso(l.peso_carcaca_kg); } } : null,
          { id: 'valor', rotulo: 'Valor', num: true, formatar: function (l) { return Fmt.dinheiro(l.valor_individual); } },
          linhas.some(function (l) { return l.motivo_saida; }) ? { id: 'motivo', rotulo: 'Descarte por', valor: function (l) { return l.motivo_saida ? Store.rotuloLista('MOTIVO_DESCARTE', l.motivo_saida) : '—'; } } : null,
        ].filter(Boolean),
      }).el, { dado: 'animais' }));
      var porId = {};
      linhas.forEach(function (l) { porId[l.animal_id] = l; });
      var quem = function (x) { return porId[x.animal_id] ? nomeAnimal(porId[x.animal_id]) : 'animal'; };
      if ((det.AJUSTES || []).length) corpo.appendChild(UI.secao('Correções', h('ul', { class: 'lista-simples' }, det.AJUSTES.map(function (x) { return h('li', { text: quem(x) + ': ' + (ROTULO_AJUSTE[x.campo] || Fmt.rotuloOpcao('campo', x.campo)) + ' de ' + valorAjuste_(x.campo, x.valor_anterior) + ' para ' + valorAjuste_(x.campo, x.valor_novo) + (x.justificativa ? ' · ' + x.justificativa : '') }); })), { dado: 'ajustes' }));
      if (payload.motivo_ajuste) corpo.appendChild(UI.secao('Motivo do ajuste', h('p', { text: payload.motivo_ajuste }), { dado: 'motivo-ajuste' }));
      if ((det.IDENTIFICACOES || []).length) corpo.appendChild(UI.secao('Identificações', h('ul', { class: 'lista-simples' }, det.IDENTIFICACOES.map(function (x) {
        var nome = (x.tipo === 'BRINCO' ? 'Brinco' : Fmt.rotulo('IDENTIFICACAO', x.tipo)) + ' ' + x.codigo;
        var motivo = x.motivo ? ' (' + Store.rotuloLista('MOTIVO_IDENTIFICACAO', x.motivo).toLowerCase() + ')' : '';
        return h('li', { text: quem(x) + ': ' + (ev.event_subtype === 'REMOCAO' ? nome + ' retirado em ' + Fmt.data(x.data_inicio) + motivo : nome + ' desde ' + Fmt.data(x.data_inicio) + (x.data_fim ? ' até ' + Fmt.data(x.data_fim) : '') + motivo) });
      })), { dado: 'identificacoes' }));
      if (ev.event_type === 'MARCACAO') corpo.appendChild(UI.secao('Marcação', UI.pares([
        ['O quê', (payload.acao === 'DESMARCAR' ? 'Desmarcar: ' : 'Marcar: ') + (ev.event_subtype === 'NAO_LOCALIZADO' ? 'não localizado' : 'para descarte')],
        payload.motivo_descarte ? ['Motivo do descarte', Store.rotuloLista('MOTIVO_DESCARTE', payload.motivo_descarte)] : null,
        ['No inventário', 'não muda (a marca é só um sinal no animal)'],
      ].filter(Boolean)), { dado: 'marcacao' }));
      if (ev.event_type === 'PESAGEM' && (det.PESAGENS || []).length) corpo.appendChild(UI.secao('Pesagem', UI.pares([
        ['Momento', Fmt.rotulo('TIPO_PESAGEM', det.PESAGENS[0].tipo)], ['Como foi pesado', typeof payload.peso_total_lote_kg === 'number' ? 'por lote: ' + Fmt.peso(payload.peso_total_lote_kg) + ' na balança, ' + payload.qtd_cabecas_lote + ' cabeças (cada animal com a média, estimada)' : Fmt.rotulo('METODO_PESAGEM', det.PESAGENS[0].metodo)],
        ['Jejum', payload.jejum === true ? 'sim' : 'não'],
      ]), { dado: 'pesagem' }));
