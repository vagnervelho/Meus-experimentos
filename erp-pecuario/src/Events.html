<script>
'use strict';
/*
 * ERP Pecuário — Eventos (08-ux-ui.md, seções 3 e 4). Histórico (evento.listar, paginado no servidor, com filtros de
 * tipo, período e "só os que valem", e os registros não concluídos deste aparelho); detalhe (evento.obter: animais,
 * detalhes, avisos aceitos, justificativa, o que ele substitui ou estorna e quem o anulou); "Estornar" (ESTORNO pelo
 * fluxo de registro, com a simulação do servidor) e "Corrigir" (evento substituto do mesmo tipo, com os mesmos
 * animais, simulação e a diferença para o original). O registro em si (seletor, formulário, revisão, resultado) é o
 * do Registro (Components); as entradas por contexto ficam na ficha, no painel do pasto e na listagem.
 */
var TelaEventos = (function () {
  var h = Util.h;
  var CORRIGIVEIS = ['ENTRADA_INICIAL', 'OUTRA_ENTRADA', 'NASCIMENTO', 'COMPRA', 'VENDA', 'TRANSFERENCIA', 'MORTE', 'DESCARTE'];
  var filtros = { tipo: '', de: '', ate: '', vigentes: false, pagina: 1 };
  function situacao(e) {
    if (e.event_type === 'ESTORNO') return 'Estorno';
    if (e.vigente) return 'Vale';
    if (e.anulado_por) return 'Não vale (estornado ou corrigido)';
    return Fmt.rotulo('STATUS_EVENTO', e.status);
  }
  function rotuloEvento(e) { return (e.rotulo || Fmt.rotulo('', e.event_type)) + ' de ' + Fmt.data(e.event_date) + (e.animais ? ' (' + e.animais + (e.animais === 1 ? ' animal)' : ' animais)') : ''); }
  function linkEvento(id, texto) { var r = 'evento/' + id; return h('a', { class: 'botao botao-texto', href: Roteador.href(r), dataset: { rota: r } }, texto); }
  function montarLista(el) {
    var vivo = true;
    el.appendChild(h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Eventos' }), App.podeRegistrar() ? h('a', { class: 'botao botao-primario', href: Roteador.href('evento/novo'), dataset: { rota: 'evento/novo' } }, 'Registrar evento') : null));
    var pend = h('div');
    el.appendChild(pend);
    Rascunhos.listar().then(function (rs) {
      var abertos = rs.filter(function (r) { return Store.tipoEvento(r.tipo); });
      if (!vivo || !abertos.length) return;
      pend.appendChild(UI.secao('Não concluídos neste aparelho', h('ul', { class: 'lista-simples' }, abertos.map(function (r) {
        return h('li', { class: 'linha-acao' }, h('span', { text: Registro.descricaoRascunho(r) + (r.estado === 'ENVIANDO' ? ' · verificando se gravou' : '') }), h('a', { class: 'botao botao-secundario', href: Roteador.href('evento/novo/' + r.tipo), dataset: { rota: 'evento/novo/' + r.tipo } }, 'Continuar'));
      })), { dado: 'nao-concluidos' }));
    }, function (e) { pend.appendChild(UI.nota('Não foi possível ler os rascunhos: ' + e.message, 'aviso')); });
    var tipos = [['', 'Todos']].concat((Store.catalogo().tipos || []).map(function (t) { return [t.tipo, t.rotulo]; }));
    var sel = h('select', { id: 'ev-tipo' }, tipos.map(function (t) { return h('option', { value: t[0], text: t[1], selected: t[0] === filtros.tipo }); }));
    var de = h('input', { type: 'date', id: 'ev-de', value: filtros.de });
    var ate = h('input', { type: 'date', id: 'ev-ate', value: filtros.ate });
    var vig = h('input', { type: 'checkbox', id: 'ev-vig', checked: filtros.vigentes });
    var campo = function (id, rot, c) { return h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: id, text: rot }), c); };
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Filtrar eventos', on: { submit: function (ev) { ev.preventDefault(); filtros.pagina = 1; carregar(); } } },
      campo('ev-tipo', 'Tipo', sel), campo('ev-de', 'De', de), campo('ev-ate', 'Até', ate),
      h('label', { class: 'marca', for: 'ev-vig' }, vig, h('span', { text: 'Só os que valem' })), UI.botao('Filtrar', { tipo: 'primario', atributos: { type: 'submit' } })));
    var resumo = h('p', { class: 'dado', role: 'status' });
    var corpo = h('div');
    el.appendChild(resumo);
    el.appendChild(corpo);
    async function carregar() {
      filtros.tipo = sel.value; filtros.de = de.value; filtros.ate = ate.value; filtros.vigentes = vig.checked;
      Util.limpar(corpo);
      corpo.appendChild(UI.carregando('Buscando os lançamentos…'));
      try {
        var q = { pagina: filtros.pagina };
        ['tipo', 'de', 'ate'].forEach(function (k) { if (filtros[k]) q[k] = filtros[k]; });
        if (filtros.vigentes) q.vigentes = true;
        var r = (await Cliente.consulta('evento.listar', q)).data;
        if (!vivo) return;
        Util.limpar(corpo);
        var paginas = Math.max(1, Math.ceil(r.total / r.por_pagina));
        resumo.textContent = r.total + (r.total === 1 ? ' lançamento' : ' lançamentos');
        corpo.appendChild(UI.tabela({
          id: 'eventos', rotulo: 'Lançamentos', linhas: r.itens, chave: function (e) { return e.event_id; }, porPagina: r.por_pagina, semPaginacao: true, vazio: { texto: 'Nenhum lançamento com esses filtros.' },
          colunas: [
            { id: 'event_date', rotulo: 'Data', formatar: function (e) { return Fmt.data(e.event_date); } },
            { id: 'rotulo', rotulo: 'Lançamento', formatar: function (e) { return linkEvento(e.event_id, e.rotulo + (e.event_subtype ? ' · ' + Fmt.rotulo('', e.event_subtype) : '')); } },
            { id: 'animais', rotulo: 'Animais', num: true },
            { id: 'total_value', rotulo: 'Valor', num: true, formatar: function (e) { return Fmt.dinheiro(e.total_value); } },
            { id: 'situacao', rotulo: 'Situação', valor: situacao },
            { id: 'source', rotulo: 'Origem', valor: function (e) { return Fmt.rotulo('FONTE', e.source); } },
          ],
        }).el);
        if (paginas > 1) {
          corpo.appendChild(h('div', { class: 'paginacao' }, h('span', { class: 'suave', text: 'Página ' + r.pagina + ' de ' + paginas }), h('div', { class: 'acoes', style: 'margin-top:0' },
            UI.botao('Anterior', { desabilitado: r.pagina <= 1, aoClicar: function () { filtros.pagina -= 1; carregar(); } }),
            UI.botao('Próxima', { desabilitado: r.pagina >= paginas, aoClicar: function () { filtros.pagina += 1; carregar(); } }))));
        }
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
      }
    }
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ correção ----
  function texto_(v) { return v === null || v === undefined || v === '' ? null : v; }
  function boolDe(v) { return v === 'S' || v === true ? true : v === 'N' || v === false ? false : null; }
  function pesoTexto_(v) { return v === null || v === undefined ? null : Fmt.numero(v, 1).replace(/\./g, ''); }
  function limpo_(v) { Object.keys(v).forEach(function (k) { if (v[k] === null || v[k] === undefined) delete v[k]; }); return v; }
  function dinheiroTexto_(v) { return v === null || v === undefined ? null : Fmt.centavosParaTexto(v); }
  function codigoConta_(f) { var c = Store.conta(f.conta_id); return c ? c.codigo : null; }
  /** Lançamento opcional da morte (custos) ou do descarte (receita): campos do cabeçalho a partir do lançamento e do título. */
  function lancamentoDaSaida_(det, origem, tipo) {
    var f = (det.FINANCEIRO || [])[0];
    if (!f) return;
    var p = tipo === 'MORTE' ? 'custo_' : 'receita_';
    var t = (det.PARCELAS || []).filter(function (x) { return x.financial_id === f.financial_id; })[0] || {};
    origem[p + 'valor'] = dinheiroTexto_(f.valor);
    if (tipo === 'MORTE') origem.custo_conta_id = f.conta_id;
    origem[p + 'partner_id'] = f.partner_id; origem[p + 'vencimento'] = t.data_vencimento; origem[p + 'forma_pagamento'] = t.forma_pagamento;
    origem[p + 'documento'] = f.documento; origem[p + 'descricao'] = f.descricao;
  }
  /**
   * Correção de compra: o cabeçalho vem de COMPRAS, do evento e dos lançamentos (parcelas do valor dos animais; frete e
   * outros custos, um por item, os fretes primeiro); cada animal, da linha do evento (o criado leva os
   * atributos de criação; o que voltou ao rebanho, só os campos da volta).
   */
  function previaCompra_(o, def, origem) {
    var ev = o.evento, det = o.detalhes || {}, linhasEv = (o.linhas || []).filter(function (l) { return Number(l.efeito_inventario) === 1; });
    var cp = (det.COMPRAS || [])[0] || {};
    var fins = det.FINANCEIRO || [];
    var principal = fins.filter(function (f) { return codigoConta_(f) === 'COMPRA_ANIMAIS'; })[0] || fins[0] || {};
    // Fretes foram gravados antes dos outros custos: o prefixo dos lançamentos acessórios que soma o frete é de fretes.
    var acess = fins.filter(function (f) { return f !== principal; });
    var tipos = {};
    var acum = 0;
    acess.forEach(function (f) { tipos[f.financial_id] = acum < (cp.frete || 0) ? 'FRETE' : 'OUTRO'; acum += f.valor || 0; });
    var parcelasDe = function (id) { return (det.PARCELAS || []).filter(function (x) { return x.financial_id === id; }); };
    var rat = (det.RATEIOS || []).filter(function (r) { return r.financial_id === principal.financial_id; })[0] || {};
    var bases = {};
    (det.ALOCACOES_FINANCEIRAS || []).forEach(function (a) { if (a.rateio_id === rat.rateio_id) bases[a.animal_id] = a.base_valor; });
    var idents = Utils_agrupar(det.IDENTIFICACOES || []);
    var pesos = Utils_agrupar(det.PESAGENS || []);
    var pastoLote = linhasEv.length ? linhasEv[0].pasto_destino_id : null;
    var todosPesados = linhasEv.length && linhasEv.every(function (l) { return l.peso !== null && l.peso !== undefined; });
    origem.partner_id = ev.partner_id || principal.partner_id; origem.finalidade = cp.finalidade; origem.modalidade = cp.modalidade;
    origem.base_peso = cp.modalidade === 'ARROBA' ? cp.base_peso : null;
    if (cp.rendimento_tipo === 'NEGOCIADO' || cp.rendimento_tipo === 'ESTIMADO') { origem.rendimento_carcaca_pct = pesoTexto_(cp.rendimento_carcaca_pct); origem.rendimento_tipo = cp.rendimento_tipo; }
    origem.preco_unitario = dinheiroTexto_(cp.preco_unitario); origem.peso_total_kg = todosPesados ? null : pesoTexto_(cp.peso_total_kg);
    origem.valor_animais = dinheiroTexto_(cp.valor_animais); origem.criterio_rateio = cp.modalidade === 'LOTE' ? cp.criterio_rateio : null;
    origem.justificativa_rateio = rat.justificativa; origem.pasto_destino_id = pastoLote; origem.gta_numero = cp.gta_numero; origem.nota_fiscal = cp.nota_fiscal; origem.condicoes = cp.observacoes;
    var comValor = cp.criterio_rateio === 'VALOR_INDIVIDUAL';
    var antes = { campos: {}, linhas: {} };
    var linhas = linhasEv.map(function (l) {
      var at = l.atributos_iniciais_json;
      var ids = idents[l.animal_id] || [];
      var cod = function (t) { var x = ids.filter(function (i) { return i.tipo === t; })[0]; return x ? x.codigo : null; };
      var ps = (pesos[l.animal_id] || [])[0];
      var v = { brinco: cod('BRINCO'), brinco_origem: cod('BRINCO_ORIGEM'), pasto_destino_id: l.pasto_destino_id !== pastoLote ? l.pasto_destino_id : null,
        peso: pesoTexto_(l.peso), metodo_pesagem: ps ? ps.metodo : null, peso_carcaca_kg: pesoTexto_(l.peso_carcaca_kg),
        valor_individual: comValor ? dinheiroTexto_(l.valor_individual) : null, base_manual: cp.criterio_rateio === 'MANUAL' && bases[l.animal_id] !== undefined ? String(bases[l.animal_id]).replace('.', ',') : null, observacoes: l.observacoes };
      if (at) {
        var a = Store.animal(l.animal_id);
        Object.assign(v, { nome: a ? a.nome : null, sexo: at.sexo, raca: at.raca, data_nascimento: at.data_nascimento, data_nascimento_confianca: at.data_nascimento_confianca,
          castrado: boolDe(at.castrado), reprodutor: boolDe(at.reprodutor), partos_previos: at.partos_previos === undefined || at.partos_previos === null ? null : String(at.partos_previos),
          situacao_reprodutiva: at.situacao_reprodutiva, data_prevista_parto: at.data_prevista_parto });
        var outras = ids.filter(function (x) { return x.tipo !== 'BRINCO' && x.tipo !== 'BRINCO_ORIGEM'; }).map(function (x) { return { tipo: x.tipo, codigo: x.codigo }; });
        if (outras.length) v.outras_identificacoes = outras;
      }
      limpo_(v);
      antes.linhas[l.animal_id] = Util.clonar(v);
      return { animal_id: l.animal_id, criado: !!at, valores: v };
    });
    var grupos = {
      parcelas: parcelasDe(principal.financial_id).map(function (x) { return { valores: limpo_({ data_vencimento: x.data_vencimento, valor: dinheiroTexto_(x.valor), forma_pagamento: x.forma_pagamento, documento: x.documento }) }; }),
      custos: fins.filter(function (f) { return f !== principal; }).map(function (f) {
        var t = parcelasDe(f.financial_id)[0] || {};
        return { valores: limpo_({ tipo: tipos[f.financial_id] || 'FRETE', valor: dinheiroTexto_(f.valor), partner_id: f.partner_id, data_vencimento: t.data_vencimento, forma_pagamento: t.forma_pagamento, documento: f.documento, descricao: f.descricao }) };
      }),
    };
    var campos = {};
    (def.campos || []).forEach(function (d) { if (texto_(origem[d.id]) !== null) campos[d.id] = origem[d.id]; });
    antes.campos = Util.clonar(campos);
    antes.grupos = Util.clonar(grupos);
    return { campos: campos, linhas: linhas, grupos: grupos, origem: 'evento/' + ev.event_id, corrige: { event_id: ev.event_id, rotulo: rotuloEvento(ev), antes: antes } };
  }
  /**
   * Correção de venda: o cabeçalho vem de VENDAS e do evento; as parcelas, da receita (conta VENDA_ANIMAIS); cada
   * dedução, do seu lançamento, com o tipo guardado em payload_json.deducoes; cada animal, da linha de saída (peso
   * vivo, carcaça, valor só quando foi informado por animal, motivo de saída). O pasto de origem fica vazio: o
   * servidor o tira da linha do tempo.
   */
  function previaVenda_(o, def, origem) {
    var ev = o.evento, det = o.detalhes || {}, linhasEv = (o.linhas || []).filter(function (l) { return Number(l.efeito_inventario) === -1; });
    var vd = (det.VENDAS || [])[0] || {};
    var fins = det.FINANCEIRO || [];
    var receita = fins.filter(function (f) { return codigoConta_(f) === 'VENDA_ANIMAIS'; })[0] || fins[0] || {};
    var tipoDe = {};
    ((ev.payload || {}).deducoes || []).forEach(function (x) { tipoDe[x.financial_id] = x.tipo; });
    var parcelasDe = function (id) { return (det.PARCELAS || []).filter(function (x) { return x.financial_id === id; }); };
    var rat = (det.RATEIOS || []).filter(function (r) { return r.financial_id === receita.financial_id; })[0] || {};
    var bases = {};
    (det.ALOCACOES_FINANCEIRAS || []).forEach(function (a) { if (a.rateio_id === rat.rateio_id) bases[a.animal_id] = a.base_valor; });
    var pesos = Utils_agrupar(det.PESAGENS || []);
    var todosPesados = linhasEv.length && linhasEv.every(function (l) { return l.peso !== null && l.peso !== undefined; });
    var todasCarcacas = linhasEv.length && linhasEv.every(function (l) { return l.peso_carcaca_kg !== null && l.peso_carcaca_kg !== undefined; });
    origem.partner_id = ev.partner_id || receita.partner_id; origem.finalidade = vd.finalidade; origem.modalidade = vd.modalidade;
    origem.base_peso = vd.modalidade === 'ARROBA' ? vd.base_peso : null;
    if (vd.rendimento_tipo === 'NEGOCIADO' || vd.rendimento_tipo === 'ESTIMADO') { origem.rendimento_carcaca_pct = pesoTexto_(vd.rendimento_carcaca_pct); origem.rendimento_tipo = vd.rendimento_tipo; }
    origem.preco_unitario = dinheiroTexto_(vd.preco_unitario);
    origem.peso_vivo_total_kg = todosPesados ? null : pesoTexto_(vd.peso_vivo_total_kg);
    origem.peso_carcaca_total_kg = vd.base_peso === 'CARCACA' && !todasCarcacas ? pesoTexto_(vd.peso_carcaca_total_kg) : null;
    origem.valor_bruto = dinheiroTexto_(vd.valor_bruto); origem.desconto_comercial = vd.desconto_comercial ? dinheiroTexto_(vd.desconto_comercial) : null;
    origem.criterio_rateio = vd.modalidade === 'LOTE' ? vd.criterio_rateio : null;
    origem.justificativa_rateio = vd.criterio_rateio === 'MANUAL' ? rat.justificativa : null;
    origem.gta_numero = vd.gta_numero; origem.nota_fiscal = vd.nota_fiscal; origem.condicoes = vd.observacoes;
    var comValor = vd.criterio_rateio === 'VALOR_INDIVIDUAL';
    var antes = { campos: {}, linhas: {} };
    var linhas = linhasEv.map(function (l) {
      var ps = (pesos[l.animal_id] || [])[0];
      var v = limpo_({ peso: pesoTexto_(l.peso), metodo_pesagem: ps && ps.metodo !== 'BALANCA' ? ps.metodo : null, peso_carcaca_kg: pesoTexto_(l.peso_carcaca_kg),
        valor_individual: comValor ? dinheiroTexto_(l.valor_individual) : null, base_manual: vd.criterio_rateio === 'MANUAL' && bases[l.animal_id] !== undefined ? String(bases[l.animal_id]).replace('.', ',') : null,
        motivo_saida: l.motivo_saida, observacoes: l.observacoes });
      antes.linhas[l.animal_id] = Util.clonar(v);
      return { animal_id: l.animal_id, valores: v };
    });
    var grupos = {
      // Parcela única = o recebimento inteiro: o valor fica vazio, para acompanhar a receita se o preço for corrigido.
      parcelas: parcelasDe(receita.financial_id).map(function (x, k, todas) { return { valores: limpo_({ data_vencimento: x.data_vencimento, valor: todas.length === 1 ? null : dinheiroTexto_(x.valor), forma_pagamento: x.forma_pagamento, documento: x.documento }) }; }),
      deducoes: fins.filter(function (f) { return f !== receita; }).map(function (f) {
        var t = parcelasDe(f.financial_id)[0] || {};
        var tipo = tipoDe[f.financial_id] || 'OUTRA';
        // A descrição que o servidor propôs ("Comissão da venda de 20/08/2026") não é do usuário: fica vazia, para seguir o tipo.
        var proposta = Store.rotuloLista('TIPO_DEDUCAO_VENDA', tipo) + ' da venda de ' + Fmt.data(ev.event_date);
        return { valores: limpo_({ tipo: tipo, valor: dinheiroTexto_(f.valor), retida_pelo_comprador: f.retida_pelo_comprador === true || f.retida_pelo_comprador === 'S',
          partner_id: f.partner_id, data_vencimento: t.data_vencimento, forma_pagamento: t.forma_pagamento, documento: f.documento, descricao: f.descricao === proposta ? null : f.descricao }) };
      }),
    };
    var campos = {};
    (def.campos || []).forEach(function (d) { if (texto_(origem[d.id]) !== null) campos[d.id] = origem[d.id]; });
    antes.campos = Util.clonar(campos);
    antes.grupos = Util.clonar(grupos);
    return { campos: campos, linhas: linhas, grupos: grupos, origem: 'evento/' + ev.event_id, corrige: { event_id: ev.event_id, rotulo: rotuloEvento(ev), antes: antes } };
  }
  /**
   * Correção de transferência, parto, morte e descarte: o cabeçalho vem do evento, dos pastos da linha, do detalhe
   * (BAIXAS, REPRODUCAO) e do payload; as crias do parto vêm como linhas do grupo, com o animal reaproveitado.
   */
  function previaMovimento_(o, def, origem) {
    var ev = o.evento, det = o.detalhes || {}, linhasEv = o.linhas || [];
    var tipo = ev.event_type;
    var payload = ev.payload || {};
    var campos = {};
    var antes = { campos: {}, linhas: {} };
    var linhas = [];
    var grupos = {};
    if (tipo === 'TRANSFERENCIA') {
      var l0 = linhasEv[0] || {};
      origem.pasto_origem_id = l0.pasto_origem_id; origem.pasto_destino_id = l0.pasto_destino_id; origem.gta_numero = payload.gta_numero;
      linhasEv.forEach(function (l) { linhas.push({ animal_id: l.animal_id, valores: {} }); antes.linhas[l.animal_id] = {}; });
    } else if (tipo === 'MORTE' || tipo === 'DESCARTE') {
      var b0 = (det.BAIXAS || [])[0] || {};
      origem.causa = b0.causa; origem.diagnostico = b0.diagnostico; origem.destino = b0.destino; origem.motivo = b0.motivo;
      lancamentoDaSaida_(det, origem, tipo);
      linhasEv.forEach(function (l) { var v = limpo_({ observacoes: l.observacoes }); linhas.push({ animal_id: l.animal_id, valores: v }); antes.linhas[l.animal_id] = Util.clonar(v); });
    } else if (tipo === 'NASCIMENTO') {
      var rep = (det.REPRODUCAO || [])[0] || {};
      var pesos = Utils_agrupar(det.PESAGENS || []);
      var idents = Utils_agrupar(det.IDENTIFICACOES || []);
      var crias = linhasEv.filter(function (l) { return l.papel === 'CRIA'; });
      var at0 = (crias[0] && crias[0].atributos_iniciais_json) || {};
      origem.pasto_destino_id = crias[0] ? crias[0].pasto_destino_id : null; origem.pai_id = rep.touro_id || at0.pai_id; origem.pai_confianca = at0.pai_confianca; origem.tipo_parto = rep.tipo_parto;
      linhasEv.filter(function (l) { return l.papel === 'MATRIZ'; }).forEach(function (l) { linhas.push({ animal_id: l.animal_id, valores: {} }); antes.linhas[l.animal_id] = {}; });
