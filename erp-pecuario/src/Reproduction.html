<script>
'use strict';
/*
 * ERP Pecuário — Reprodução (Fase 3, E3.4 e E3.5), carregada sob demanda (01, seção 6.2): as fêmeas do rebanho com a
 * situação reprodutiva, a cria ao pé e a previsão de parto (08, seção 3: `#/reproducao/matrizes`), o diagnóstico de gestação
 * em lote no tronco (o modo curral da pesagem: brinco → Enter → resultado → Enter), as estações de monta (03a, seção 4.10)
 * e os indicadores por estação e por categoria (07, seção 8.3). Também a ficha reprodutiva da matriz (bloco G, pedida pela
 * ficha do animal) e a prévia da correção dos lançamentos de reprodução, desmama, castração e ocorrência.
 *
 * Tudo o que é conta vem do servidor (P5): a situação reprodutiva (projeção), a previsão de parto (sempre estimativa, salvo
 * a informada), as taxas com numerador, denominador e n, o "parcial" e o motivo do "—". A tela só mostra, filtra e abre o
 * formulário do lançamento (Registro). O sistema registra o que o veterinário e o dono decidem: nada aqui prescreve.
 */
var TelaReproducao = (function () {
  var h = Util.h;
  var ABAS = [['matrizes', 'Fêmeas'], ['tronco', 'Diagnóstico no tronco'], ['indicadores', 'Indicadores'], ['estacoes', 'Estações de monta']];
  var SUBS = [['EXPOSICAO', 'Exposição ao touro'], ['COBERTURA', 'Cobertura'], ['INSEMINACAO', 'Inseminação'], ['DIAGNOSTICO_GESTACAO', 'Diagnóstico'], ['ABORTO', 'Aborto']];
  var TIPOS_ESTACAO = ['MONTA_NATURAL', 'IA', 'MISTA'];
  var ROTULO_TIPO_ESTACAO = { MONTA_NATURAL: 'Monta natural', IA: 'Inseminação artificial', MISTA: 'Mista (inseminação e repasse com touro)' };
  var ID_RASCUNHO = 'tronco-diagnostico';
  var TIPO_RASCUNHO = 'TRONCO_DIAGNOSTICO';
  var BLOCO = 20;
  var filtros = { data: '', estacao_id: '', situacao: '', pasture_id: '' };
  var filtroInd = { estacao_id: '', ano: '' };

  function campo(id, rotulo, controle, ajuda) {
    return h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: id, text: rotulo }), controle, ajuda ? h('p', { class: 'campo-ajuda', text: ajuda }) : null);
  }
  function opcoes(lista, atual, vazio) {
    return (vazio ? [h('option', { value: '', text: vazio })] : []).concat(lista.map(function (x) { return h('option', { value: x[0], text: x[1], selected: x[0] === atual }); }));
  }
  function link(rota, texto) { return h('a', { class: 'botao botao-texto', href: Roteador.href(rota), dataset: { rota: rota } }, texto); }
  function nomeDe(id) { var a = Store.animal(id); return a ? Store.rotuloAnimal(a) : 'animal'; }
  function sit(codigo) { return codigo ? Fmt.rotulo('SITUACAO_REPRODUTIVA', codigo) : '—'; }
  function estacoes() { return Store.estacoes(); }
  function nomeEstacao(id) { var e = Store.estacao(id); return e ? e.nome : '—'; }
  function pct(ind) {
    var v = UI.valorInd(ind, function (x) { return Fmt.numero(x, 1) + '%'; });
    return v.motivo ? v.texto + ' (' + v.motivo + ')' : v.texto;
  }
  /** "Estimativa: 02/09/2027 (de 13/08 a 22/09)" — a previsão do servidor, sempre rotulada. */
  function textoPrevisao(p) {
    if (!p) return '—';
    if (p.nivel === null) return p.rotulo;
    var janela = p.inicio ? (p.fim ? 'de ' + Fmt.data(p.inicio) + ' a ' + Fmt.data(p.fim) : 'a partir de ' + Fmt.data(p.inicio)) : '';
    if (p.nivel === 3) return 'Estimativa pela exposição: ' + janela;
    return (p.nivel === 0 ? 'Informada: ' : 'Estimativa: ') + Fmt.data(p.data) + (janela ? ' (' + janela + ')' : '');
  }
  function cabecalho(aba) {
    var acoes = h('div', { class: 'acoes', style: 'margin-top:0' });
    if (App.podeRegistrar() && Store.tipoEvento('REPRODUCAO')) acoes.appendChild(h('a', { class: 'botao botao-primario', href: Roteador.href('evento/novo/REPRODUCAO'), dataset: { rota: 'evento/novo/REPRODUCAO' } }, 'Registrar'));
    return h('div', null, h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Reprodução' }), acoes),
      UI.abas('Partes da reprodução', ABAS.map(function (x) { return { rotulo: x[1], rota: 'reproducao/' + x[0], atual: x[0] === aba }; })));
  }
  /** Abre o Registro do subtipo com as fêmeas escolhidas e a estação da data (sugestão: o servidor usa o que for enviado). */
  function registrar(tipo, sub, ids) {
    var campos = {};
    if (tipo === 'REPRODUCAO' && sub !== 'ABORTO') {
      var hoje = Fmt.hoje();
      var est = estacoes().filter(function (e) { return e.data_inicio <= hoje && (sub === 'DIAGNOSTICO_GESTACAO' || e.data_fim >= hoje); })[0];
      if (est) campos.estacao_id = est.estacao_id;
    }
    Registro.abrir(tipo, { subtipo: tipo === 'REPRODUCAO' ? sub : undefined, campos: campos, linhas: (ids || []).map(function (id) { return { animal_id: id }; }), origem: 'reproducao/matrizes' });
  }

  // ------------------------------------------------------------------ fêmeas ----
  function blocoAlertas(lista) {
    if (!lista.length) return null;
    return UI.tabela({ id: 'repro-alertas', rotulo: 'Partos previstos e prenhezes vencidas', linhas: lista, chave: function (x) { return x.codigo + x.animal_id; },
      colunas: [
        { id: 'animal', rotulo: 'Fêmea', valor: function (x) { return x.brinco || x.codigo_interno; }, formatar: function (x) { return link('animal/' + x.animal_id + '/reproducao', x.brinco || x.codigo_interno); } },
        { id: 'codigo', rotulo: 'Alerta', valor: function (x) { return x.codigo === 'PARTO_PREVISTO' ? 'Parto previsto' : 'Prenhez com a previsão vencida: registre o parto ou o aborto'; } },
        { id: 'data', rotulo: 'Previsão (estimativa)', valor: function (x) { return x.data_prevista; }, formatar: function (x) { return Fmt.data(x.data_prevista); } },
      ] }).el;
  }
  function montarMatrizes(el) {
    var vivo = true;
    var escolhidas = [];
    el.appendChild(cabecalho('matrizes'));
    var data = h('input', { type: 'date', id: 'rm-data', value: filtros.data });
    var est = h('select', { id: 'rm-estacao' }, opcoes(estacoes().map(function (e) { return [e.estacao_id, e.nome]; }), filtros.estacao_id, 'Todas as fêmeas'));
    var sitSel = h('select', { id: 'rm-situacao' }, opcoes(['VAZIA', 'EXPOSTA', 'INSEMINADA', 'PRENHA', 'SEM_INFORMACAO', 'NAO_APTA'].map(function (s) { return [s, sit(s)]; }), filtros.situacao, 'Qualquer situação'));
    var pasto = h('select', { id: 'rm-pasto' }, opcoes(Store.pastos({ todos: true }).map(function (p) { return [p.pasture_id, p.nome]; }), filtros.pasture_id, 'Todos'));
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Filtrar as fêmeas', on: { submit: function (ev) {
      ev.preventDefault();
      filtros.data = data.value; filtros.estacao_id = est.value; filtros.situacao = sitSel.value; filtros.pasture_id = pasto.value;
      carregar();
    } } }, campo('rm-data', 'Situação em', data, 'Vazio = hoje.'), campo('rm-estacao', 'Expostas na estação', est), campo('rm-situacao', 'Situação', sitSel), campo('rm-pasto', 'Pasto', pasto),
      UI.botao('Atualizar', { tipo: 'primario', atributos: { type: 'submit' } })));
    var acoes = h('div', { class: 'acoes', dataset: { acoesFemeas: '1' } });
    var corpo = h('div', { dataset: { matrizes: '1' } }, UI.carregando('Buscando as fêmeas…'));
    el.appendChild(acoes);
    el.appendChild(corpo);
    function desenharAcoes() {
      Util.limpar(acoes);
      if (!App.podeRegistrar()) return;
      var n = escolhidas.length;
      acoes.appendChild(h('span', { class: 'suave', text: n ? n + (n === 1 ? ' fêmea escolhida:' : ' fêmeas escolhidas:') : 'Escolha as fêmeas na lista para registrar:' }));
      SUBS.forEach(function (x) { acoes.appendChild(UI.botao(x[1], { desabilitado: !n, atributos: { 'data-registrar': x[0] }, aoClicar: function () { registrar('REPRODUCAO', x[0], escolhidas); } })); });
    }
    async function carregar() {
      Util.limpar(corpo);
      corpo.appendChild(UI.carregando('Buscando as fêmeas…'));
      var dados = {};
      ['data', 'estacao_id', 'situacao', 'pasture_id'].forEach(function (k) { if (filtros[k]) dados[k] = filtros[k]; });
      var d;
      try {
        d = (await Cliente.consulta('reproducao.matrizes', dados)).data;
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
        return;
      }
      if (!vivo) return;
      Util.limpar(corpo);
      escolhidas = [];
      desenharAcoes();
      var r = d.resumo;
      var ps = r.por_situacao;
      corpo.appendChild(h('div', { class: 'indicadores', role: 'list', dataset: { resumoMatrizes: String(r.total) } },
        UI.indicador('Fêmeas', String(r.total), 'em ' + Fmt.dataCurta(d.data), 'femeas'),
        UI.indicador('Prenhes', String(ps.PRENHA || 0), null, 'prenhas'),
        UI.indicador('Vazias', String(ps.VAZIA || 0), null, 'vazias'),
        UI.indicador('Expostas ou inseminadas', String((ps.EXPOSTA || 0) + (ps.INSEMINADA || 0)), null, 'expostas'),
        UI.indicador('Com cria ao pé', String(r.cria_ao_pe), null, 'cria-ao-pe'),
        UI.indicador('Sem histórico reprodutivo', String(r.sem_historico), 'aptas, sem nenhum registro', 'sem-historico')));
      var al = blocoAlertas(d.alertas || []);
      if (al) corpo.appendChild(UI.secao('Alertas', al, { dado: 'alertas-reproducao' }));
      if (!d.itens.length) { corpo.appendChild(UI.nota('Nenhuma fêmea com esses filtros.', 'info')); return; }
      var t = UI.tabela({ id: 'matrizes', rotulo: 'Fêmeas e situação reprodutiva', linhas: d.itens, chave: function (x) { return x.animal_id; }, rotuloLinha: function (x) { return x.brinco || x.codigo_interno; },
        selecao: App.podeRegistrar() ? { aoMudar: function (ids) { escolhidas = ids; desenharAcoes(); } } : null,
        colunas: [
          { id: 'animal', rotulo: 'Fêmea', valor: function (x) { return x.brinco || x.codigo_interno; }, formatar: function (x) { return link('animal/' + x.animal_id + '/reproducao', x.brinco || x.codigo_interno); } },
          { id: 'situacao', rotulo: 'Situação', valor: function (x) { return sit(x.situacao_reprodutiva) + (x.apta ? '' : ' (jovem)'); } },
          { id: 'cria', rotulo: 'Cria ao pé', valor: function (x) { return x.cria_ao_pe ? 'sim' : 'não'; } },
          { id: 'partos', rotulo: 'Partos', num: true },
          { id: 'idade', rotulo: 'Idade (meses)', num: true, valor: function (x) { return x.idade_meses; }, formatar: function (x) { return x.idade_meses === null ? '—' : String(x.idade_meses); } },
          { id: 'ultimo', rotulo: 'Último registro', valor: function (x) { return x.ultimo ? x.ultimo.data : ''; }, formatar: function (x) { return x.ultimo ? link('evento/' + x.ultimo.event_id, Fmt.data(x.ultimo.data) + ' · ' + Fmt.rotulo('TIPO_EVENTO_REPRODUTIVO', x.ultimo.tipo_evento) + (x.ultimo.resultado ? ' ' + Fmt.rotulo('RESULTADO_DG', x.ultimo.resultado).toLowerCase() : '')) : '—'; } },
          { id: 'previsao', rotulo: 'Previsão de parto', valor: function (x) { return x.previsao_parto ? x.previsao_parto.data || x.previsao_parto.inicio || '' : ''; }, formatar: function (x) { return textoPrevisao(x.previsao_parto); } },
        ] });
      corpo.appendChild(t.el);
      corpo.appendChild(UI.nota('A previsão de parto é sempre estimativa (dias de gestação do cadastro), salvo a informada pelo veterinário.', 'info'));
    }
    desenharAcoes();
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ indicadores ----
  function linhasTaxas(g) {
    return [
      ['Expostas', String(g.expostas)],
      ['Taxa de prenhez', pct(g.prenhez) + ' · ' + g.prenhez.numerador + ' de ' + g.prenhez.denominador + (g.prenhez.rotulo !== 'Taxa de prenhez' ? ' (' + g.prenhez.rotulo.toLowerCase() + ')' : '')],
      ['Diagnosticadas', g.diagnosticadas + ' de ' + (g.expostas - g.sairam_sem_diagnostico) + ' (cobertura do diagnóstico ' + pct(g.cobertura_dg) + ')'],
      ['Taxa de parição', pct(g.paricao) + ' · ' + g.paricao.numerador + ' de ' + g.paricao.denominador + (g.paricao.parcial ? ' (parcial: há prenhe ainda sem parto)' : '')],
      ['Natalidade', pct(g.natalidade) + ' · ' + g.natalidade.numerador + ' nascidos vivos de ' + g.natalidade.denominador + ' expostas'],
      ['Perda gestacional', pct(g.perda_gestacional) + ' · ' + g.perda_gestacional.numerador + ' de ' + g.perda_gestacional.denominador + ' prenhes' + (g.perda_gestacional.parcial ? ' (parcial)' : '')],
      ['Taxa de desmama', pct(g.desmama) + ' · ' + g.desmama.numerador + ' de ' + g.desmama.denominador + (g.desmama.parcial ? ' (parcial: ' + g.crias_ao_pe + ' ainda ao pé)' : '')],
      ['Mortalidade até a desmama', pct(g.mortalidade_ate_desmama) + ' · ' + g.mortalidade_ate_desmama.numerador + ' de ' + g.mortalidade_ate_desmama.denominador + ' nascidos vivos' + (g.vendidos_ao_pe ? ' · ' + g.vendidos_ao_pe + ' vendidos ao pé, à parte' : '')],
      ['Intervalo entre partos', g.iep_dias.valor === null ? '— (' + Fmt.rotulo('MOTIVO', g.iep_dias.motivo) + ', n = ' + g.iep_dias.n + ')' : g.iep_dias.valor + ' dias (n = ' + g.iep_dias.n + ')'],
      ['Idade ao primeiro parto', g.idade_primeiro_parto_meses.valor === null ? '— (' + Fmt.rotulo('MOTIVO', g.idade_primeiro_parto_meses.motivo) + ', n = ' + g.idade_primeiro_parto_meses.n + ')' : Fmt.numero(g.idade_primeiro_parto_meses.valor, 1) + ' meses (n = ' + g.idade_primeiro_parto_meses.n + ')'],
      g.sairam_sem_diagnostico || g.sairam_sem_desfecho ? ['Saíram no meio da estação', g.sairam_sem_diagnostico + ' antes do diagnóstico (fora da prenhez) · ' + g.sairam_sem_desfecho + ' sem parto, aborto nem diagnóstico vazio (fora da parição, da natalidade e da desmama)'] : null,
    ];
  }
  function montarIndicadores(el) {
    var vivo = true;
    el.appendChild(cabecalho('indicadores'));
    var est = h('select', { id: 'ri-estacao' }, opcoes(estacoes().map(function (e) { return [e.estacao_id, e.nome]; }), filtroInd.estacao_id, 'A mais recente'));
    var ano = h('input', { type: 'text', inputmode: 'numeric', id: 'ri-ano', value: filtroInd.ano, maxlength: 4 });
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Escolher a estação', on: { submit: function (ev) {
      ev.preventDefault();
      if (ano.value && !/^\d{4}$/.test(ano.value.trim())) { UI.aviso('O ano tem quatro algarismos (ex.: 2026).', { tipo: 'erro' }); return; }
      filtroInd.estacao_id = est.value; filtroInd.ano = ano.value.trim();
      carregar();
    } } }, campo('ri-estacao', 'Estação de monta', est), campo('ri-ano', 'Ou o ano (sem estação)', ano, 'Fazenda com touro o ano todo: os indicadores anuais.'),
      UI.botao('Ver', { tipo: 'primario', atributos: { type: 'submit' } })));
    var corpo = h('div', { dataset: { indicadoresReproducao: '1' } }, UI.carregando('Calculando os indicadores…'));
    el.appendChild(corpo);
    async function carregar() {
      Util.limpar(corpo);
      corpo.appendChild(UI.carregando('Calculando os indicadores…'));
      var dados = {};
      if (filtroInd.estacao_id) dados.estacao_id = filtroInd.estacao_id;
      else if (filtroInd.ano) dados.ano = filtroInd.ano;
      var d;
      try {
        d = (await Cliente.consulta('reproducao.indicadores', dados)).data;
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
        return;
      }
      if (!vivo) return;
      Util.limpar(corpo);
      var m = d.matrizes;
      corpo.appendChild(h('div', { class: 'indicadores', role: 'list', dataset: { matrizesAtivas: String(m.ativas) } },
        UI.indicador('Matrizes ativas', m.ativas === null ? '—' : String(m.ativas), 'aptas, sem marca de descarte', 'matrizes-ativas'),
        UI.indicador('Prenhes', m.prenhas === null ? '—' : String(m.prenhas), m.sem_informacao ? m.sem_informacao + ' sem informação' : null, 'matrizes-prenhas'),
        UI.indicador('Sem histórico reprodutivo', m.sem_historico === null ? '—' : String(m.sem_historico), null, 'matrizes-sem-historico')));
      if (d.estacao) {
        var e = d.estacao;
        corpo.appendChild(UI.secao(e.estacao.nome + ' (' + Fmt.data(e.estacao.data_inicio) + ' a ' + Fmt.data(e.estacao.data_fim) + ')', UI.pares(linhasTaxas(e.geral)), { dado: 'estacao-geral' }));
        if (e.por_categoria.length) corpo.appendChild(UI.secao('Por categoria (na exposição)', UI.tabela({ id: 'repro-categorias', rotulo: 'Indicadores por categoria', linhas: e.por_categoria, chave: function (x) { return x.category_id || 'sem'; },
          colunas: [
            { id: 'nome', rotulo: 'Categoria' },
            { id: 'expostas', rotulo: 'Expostas', num: true },
            { id: 'prenhez', rotulo: 'Prenhez', num: true, valor: function (x) { return x.prenhez.valor; }, formatar: function (x) { return pct(x.prenhez); } },
            { id: 'paricao', rotulo: 'Parição', num: true, valor: function (x) { return x.paricao.valor; }, formatar: function (x) { return pct(x.paricao); } },
            { id: 'natalidade', rotulo: 'Natalidade', num: true, valor: function (x) { return x.natalidade.valor; }, formatar: function (x) { return pct(x.natalidade); } },
            { id: 'desmama', rotulo: 'Desmama', num: true, valor: function (x) { return x.desmama.valor; }, formatar: function (x) { return pct(x.desmama); } },
          ] }).el, { dado: 'estacao-categorias' }));
        corpo.appendChild(UI.nota('Com menos de ' + d.parametros.indicador_n_minimo + ' fêmeas no denominador a taxa fica "—" (dados insuficientes). Abaixo de ' + Fmt.numero(d.parametros.prenhez_cobertura_dg_min_pct, 0) + '% de diagnosticadas, a prenhez é contada entre as diagnosticadas.', 'info'));
      } else if (d.anual) {
        var a = d.anual;
        corpo.appendChild(UI.secao('Ano de ' + a.ano + ' (sem estação de monta)', UI.pares([
          ['Matrizes ativas no início do ano', a.matrizes_no_inicio === null ? '—' : String(a.matrizes_no_inicio)], ['Partos no ano', String(a.partos)], ['Nascidos vivos', String(a.nascidos_vivos)],
          ['Natalidade anual', pct(a.natalidade_anual) + (a.natalidade_anual.parcial ? ' (parcial: o ano não terminou)' : '')],
          ['Intervalo entre partos', a.iep_dias.valor === null ? '— (n = ' + a.iep_dias.n + ')' : a.iep_dias.valor + ' dias (n = ' + a.iep_dias.n + ')'],
          ['Idade ao primeiro parto', a.idade_primeiro_parto_meses.valor === null ? '— (n = ' + a.idade_primeiro_parto_meses.n + ')' : Fmt.numero(a.idade_primeiro_parto_meses.valor, 1) + ' meses (n = ' + a.idade_primeiro_parto_meses.n + ')'],
        ]), { dado: 'anual' }));
        if (!d.estacoes.length) corpo.appendChild(UI.nota('Nenhuma estação de monta cadastrada: os indicadores ficam na forma anual. Cadastre as estações na aba "Estações de monta" para ver prenhez, parição e desmama por estação.', 'info'));
      }
    }
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ estações ----
  function defsEstacao() {
    return [
      { id: 'nome', rotulo: 'Nome', tipo: 'texto', obrigatorio: true, ajuda: 'Ex.: Estação 2026/2027.' },
      { id: 'property_id', rotulo: 'Propriedade', tipo: 'ref:PROPRIEDADES' },
      { id: 'data_inicio', rotulo: 'Início', tipo: 'data', obrigatorio: true },
      { id: 'data_fim', rotulo: 'Fim', tipo: 'data', obrigatorio: true },
      { id: 'tipo', rotulo: 'Tipo', tipo: 'lista', obrigatorio: true, opcoes: TIPOS_ESTACAO, rotulos_opcoes: TIPOS_ESTACAO.map(function (t) { return ROTULO_TIPO_ESTACAO[t]; }) },
      { id: 'observacoes', rotulo: 'Observações', tipo: 'texto' },
    ];
  }
  function editarEstacao(e, origem, aoSalvar) {
    var valores = e ? { nome: e.nome, property_id: e.property_id, data_inicio: e.data_inicio, data_fim: e.data_fim, tipo: e.tipo, observacoes: e.observacoes || '' } : { tipo: 'MONTA_NATURAL', property_id: Store.param('propriedade_padrao_id') || '' };
    Cadastro.folha({
      titulo: e ? 'Estação: ' + e.nome : 'Nova estação de monta', defs: defsEstacao(), valores: valores, rota: 'estacao.salvar', origem: origem, idBase: 'est',
      montar: function (c) { return e ? { estacao_id: e.estacao_id, campos: c } : { campos: c }; },
      sucesso: function (d) { return 'Estação ' + d.nome + ' gravada.'; }, aoSalvar: aoSalvar,
    });
  }
  function montarEstacoes(el) {
    el.appendChild(cabecalho('estacoes'));
    var corpo = h('div', { dataset: { estacoes: '1' } });
    el.appendChild(corpo);

            h('span', { class: 'dado', text: n + ' · ' + (l.animal_id ? nomeDe(l.animal_id) : l.brinco) + ' · ' + ROTULO_RES[l.resultado] + (l.idade ? ' (' + l.idade + ' dias)' : '') + ' · ' + ROTULO_ESTADO[l.estado] + (ret && ret.previsao_parto ? ' · ' + textoPrevisao(ret.previsao_parto) : '') })),
          l.mensagem ? h('p', { class: 'suave', text: l.mensagem }) : null);
        var acoes = [];
        if (l.estado === 'AVISO') acoes.push(UI.botao('Está certo', { aoClicar: function () { aceitar(l); } }));
        if (l.estado !== 'GRAVADA' && l.estado !== 'ENVIANDO' && l.estado !== 'SEM_SINAL') acoes.push(UI.botao('Tirar', { tipo: 'texto', aoClicar: function () { tirar(l); } }));
        if (acoes.length) li.appendChild(h('div', { class: 'acoes', style: 'margin-top:4px' }, acoes));
        ui.lista.appendChild(li);
      });
    }
    function sessao() {
      Util.limpar(corpo);
      if (!c.iniciada) { inicio(); return; }
      var s = c.sessao;
      ui.contador = h('div', { class: 'curral-contador', role: 'status', 'aria-live': 'polite' });
      var podeMudar = !c.blocos.some(function (b) { return ['GRAVADO', 'SEM_SINAL', 'ENVIANDO'].indexOf(b.estado) >= 0; });
      corpo.appendChild(h('div', { class: 'curral-cabecalho', dataset: { troncoCabecalho: '1' } },
        h('p', { class: 'dado', text: Fmt.data(s.data) + ' · ' + Fmt.rotulo('METODO_REPRODUCAO', s.metodo) + (s.estacao_id ? ' · ' + nomeEstacao(s.estacao_id) : '') }), ui.contador,
        podeMudar ? UI.botao('Mudar data, método ou estação', { tipo: 'texto', aoClicar: function () { c.iniciada = false; sessao(); } }) : null));
      ui.brinco = h('input', { type: 'text', id: 'tr-brinco', class: 'curral-entrada', inputmode: 'numeric', autocomplete: 'off', enterkeyhint: 'next', 'aria-describedby': 'tr-conferencia' });
      ui.resultado = h('input', { type: 'text', id: 'tr-resultado', class: 'curral-entrada', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'done' });
      ui.brinco.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); var r = conferir(); if (r === 'OK' || r === 'NENHUM') ui.resultado.focus(); } });
      ui.brinco.addEventListener('input', function () { ui.atual = null; });
      ui.resultado.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); lancar(); } });
      ui.conferencia = h('div', { id: 'tr-conferencia', role: 'status', 'aria-live': 'polite', class: 'curral-conferencia' });
      ui.candidatos = h('div', { class: 'curral-candidatos' });
      ui.status = h('div', { class: 'curral-status', dataset: { troncoStatus: '1' } });
      ui.lista = h('ol', { class: 'curral-lista', reversed: true, 'aria-label': 'Diagnósticos desta sessão (o mais recente primeiro)' });
      corpo.appendChild(h('form', { class: 'curral-form', novalidate: true, on: { submit: function (ev) { ev.preventDefault(); lancar(); } } },
        h('div', { class: 'curral-campos' }, campo('tr-brinco', 'Brinco', ui.brinco), campo('tr-resultado', 'Resultado', ui.resultado, 'p = prenhe (p90 = 90 dias de gestação), v = vazia, d = duvidosa.')),
        ui.conferencia, ui.candidatos,
        h('div', { class: 'acoes' }, ['p', 'v', 'd'].map(function (k) { return UI.botao({ p: 'Prenhe', v: 'Vazia', d: 'Duvidosa' }[k], { atributos: { 'data-resultado-rapido': k, type: 'button' }, aoClicar: function () { lancar(ui.resultado.value && k === 'p' ? ui.resultado.value : k); } }); }))));
      corpo.appendChild(ui.status);
      corpo.appendChild(ui.lista);
      desenhar();
      ui.brinco.focus();
      if (c.blocos.some(function (b) { return b.estado === 'ENVIANDO' || b.estado === 'SEM_SINAL'; })) conferirBlocos(c, desenhar).catch(function (e) { Util.registrarFalha('conferir os blocos do tronco', e); });
    }
    (tronco ? Promise.resolve(tronco) : Rascunhos.obter(ID_RASCUNHO).then(function (r) { return r && r.tipo === TIPO_RASCUNHO ? r : novaSessao(); })).then(function (x) {
      if (!vivo) return;
      tronco = c = x;
      sessao();
    }, function (e) {
      if (!vivo) return;
      Util.limpar(corpo);
      corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: function () { Roteador.ir('reproducao/tronco', { forcar: true, substituir: true }); } } }));
    });
    return function () { vivo = false; ui = {}; };
  }

  // ------------------------------------------------------------------ ficha da matriz (bloco G) ----
  /** Bloco G da ficha (08, seção 3): tudo vem de `animal.ficha` (ReproductionService.blocoFicha); a tela só mostra. */
  function blocoFicha(f) {
    var g = f.reprodutivo || {};
    var caixa = h('div', { dataset: { fichaReprodutiva: '1' } });
    if (!g.aplica) {
      caixa.appendChild(UI.nota(g.mensagem || 'Não se aplica.', 'info'));
      if (g.castracao) caixa.appendChild(UI.pares([['Castrado em', link('evento/' + g.castracao.event_id, Fmt.data(g.castracao.data) + (g.castracao.metodo ? ' (' + g.castracao.metodo + ')' : ''))]]));
      if ((g.como_touro || []).length) caixa.appendChild(UI.secao('Como touro', h('ul', { class: 'lista-simples' }, g.como_touro.map(function (x) { return h('li', null, link('evento/' + x.event_id, Fmt.data(x.data) + ' · ' + Fmt.rotulo('TIPO_EVENTO_REPRODUTIVO', x.tipo_evento) + (x.femeas ? ' · ' + x.femeas + (x.femeas === 1 ? ' fêmea' : ' fêmeas') : ''))); })), { dado: 'como-touro' }));
      return caixa;
    }
    var ip = g.intervalo_medio_dias || {};
    var pp = g.idade_primeiro_parto_meses || {};
    caixa.appendChild(UI.pares([
      ['Situação reprodutiva', sit(g.situacao_reprodutiva) + (g.sem_historico ? ' (sem histórico reprodutivo)' : '')], ['Cria ao pé', g.cria_ao_pe ? 'sim' : 'não'], ['Parida', g.parida ? 'sim' : 'não'],
      ['Previsão de parto', textoPrevisao(g.previsao_parto)],
      ['Partos', String(g.n_partos) + (g.partos_previos ? ' (' + g.partos_previos + ' anteriores à entrada declarados)' : '')], ['Último parto', g.ultimo_parto ? Fmt.data(g.ultimo_parto) : '—'],
      ['Bezerros', g.bezerros.nascidos_vivos + ' nascidos vivos · ' + g.bezerros.desmamados + ' desmamados · ' + g.bezerros.natimortos + ' natimortos'],
      ['Perdas gestacionais', g.perdas_gestacionais.total + ' (' + g.perdas_gestacionais.abortos + ' abortos, ' + g.perdas_gestacionais.natimortos + ' natimortos)'],
      ['Intervalo médio entre partos', ip.valor !== null && ip.valor !== undefined ? ip.valor + ' dias' : '— (' + Fmt.rotulo('MOTIVO', ip.motivo || 'DADOS_INSUFICIENTES') + ')'],
      ['Idade ao primeiro parto', pp.valor !== null && pp.valor !== undefined ? pp.valor + ' meses' : '— (' + Fmt.rotulo('MOTIVO', pp.motivo || 'DADOS_INSUFICIENTES') + ')'],
      ['Registros', g.exposicoes + ' exposições · ' + g.coberturas + ' coberturas · ' + g.inseminacoes + ' inseminações · ' + g.diagnosticos + ' diagnósticos'],
    ]));
    var partos = (g.partos || []).slice().reverse();
    caixa.appendChild(UI.secao('Partos', partos.length ? UI.tabela({ id: 'partos', rotulo: 'Partos', linhas: partos, chave: function (p) { return p.event_id; },
      colunas: [
        { id: 'data', rotulo: 'Data', formatar: function (p) { return link('evento/' + p.event_id, Fmt.data(p.data) + (p.pre_marco_zero ? ' (histórico)' : '')); } },
        { id: 'crias', rotulo: 'Crias', valor: function (p) { return (p.nascidos_vivos === 1 ? '1 viva' : p.nascidos_vivos + ' vivas') + (p.natimortos ? ' · ' + p.natimortos + (p.natimortos === 1 ? ' natimorta' : ' natimortas') : ''); } },
        { id: 'quem', rotulo: 'Quem nasceu', formatar: function (p) { return p.crias.length ? h('span', null, p.crias.map(function (c, i) { return h('span', null, i ? ', ' : '', link('animal/' + c.animal_id + '/resumo', c.brinco || c.codigo_interno || 'cria')); })) : '—'; } },
        { id: 'intervalo_dias', rotulo: 'Dias desde o anterior', num: true, formatar: function (p) { return p.intervalo_dias === null ? '—' : String(p.intervalo_dias); } },
      ] }).el : h('p', { class: 'suave', text: 'Nenhum parto registrado.' }), { dado: 'partos' }));
    var regs = g.registros || [];
    caixa.appendChild(UI.secao('Exposições, coberturas, inseminações, diagnósticos e abortos', regs.length ? UI.tabela({ id: 'registros-reprodutivos', rotulo: 'Registros reprodutivos', linhas: regs, chave: function (r) { return r.event_id + r.tipo_evento; },
      colunas: [
        { id: 'data', rotulo: 'Data', valor: function (r) { return r.data; }, formatar: function (r) { return link('evento/' + r.event_id, Fmt.data(r.data)); } },
        { id: 'tipo', rotulo: 'Registro', valor: function (r) { return Fmt.rotulo('TIPO_EVENTO_REPRODUTIVO', r.tipo_evento); } },
        { id: 'detalhe', rotulo: 'Detalhe', valor: function (r) {
          return [r.resultado ? Fmt.rotulo('RESULTADO_DG', r.resultado) : null, r.idade_gestacional_dias ? r.idade_gestacional_dias + ' dias de gestação' : null, r.metodo ? Fmt.rotulo('METODO_REPRODUCAO', r.metodo) : null,
            r.touro_id ? 'touro ' + (Store.nomeDeReferencia(r.touro_id) || 'informado') : null, r.semen_identificacao ? 'sêmen ' + r.semen_identificacao : null, r.data_fim ? 'até ' + Fmt.data(r.data_fim) : null,
            r.data_prevista_parto ? 'previsão informada ' + Fmt.data(r.data_prevista_parto) : null, r.estacao_nome].filter(Boolean).join(' · ') || '—';
        } },
      ] }).el : h('p', { class: 'suave', text: 'Nenhum registro de exposição, cobertura, inseminação ou diagnóstico.' }), { dado: 'registros' }));
    return caixa;
  }

  // ------------------------------------------------------------------ prévia da correção ----
  function texto_(v) { return v === null || v === undefined || v === '' ? null : String(v); }
  function camposDoDef(def, sub, origem) {
    var campos = {};
    ((def.subtipos && sub && def.subtipos[sub] && def.subtipos[sub].campos) || def.campos || []).forEach(function (d) { if (texto_(origem[d.id]) !== null) campos[d.id] = origem[d.id]; });
    return campos;
  }
  /** A despesa do manejo (o lançamento e o primeiro título), como foi digitada: a descrição proposta e o vencimento à vista ficam vazios. */
  function despesa(det, origem, ev) {
    var f = (det.FINANCEIRO || [])[0];
    if (!f) return;
    var ts = (det.PARCELAS || []).filter(function (x) { return x.financial_id === f.financial_id; }).sort(function (a, b) { return (a.parcela_num || 0) - (b.parcela_num || 0); });
    var t = ts[0] || {};
    origem.custo_valor = Fmt.centavosParaTexto(f.valor); origem.custo_conta_id = f.conta_id; origem.custo_partner_id = f.partner_id;
    origem.custo_vencimento = t.data_vencimento === ev.event_date ? null : t.data_vencimento; origem.custo_forma_pagamento = t.forma_pagamento;
    origem.custo_parcelas_qtd = ts.length > 1 ? String(ts.length) : null; origem.custo_documento = f.documento;
    origem.custo_descricao = /: despesa$/.test(f.descricao || '') ? null : f.descricao;
  }
  /**
   * Correção da reprodução, da desmama, da castração e da ocorrência: o cabeçalho e cada animal como foram gravados (o
   * registro reprodutivo de cada fêmea; na exposição, os touros do lote voltam à lista; na cobertura, o touro do cabeçalho;
   * na desmama, só os bezerros — a mãe é do servidor —, com o peso e o pasto de destino).
   */
  function previaCorrecao(o, def, origem) {
    var ev = o.evento, det = o.detalhes || {}, payload = ev.payload || {}, sub = ev.event_subtype;
    var linhasEv = o.linhas || [];
    var regs = {};
    (det.REPRODUCAO || []).forEach(function (r) { regs[r.animal_id] = r; });
    var antes = { campos: {}, linhas: {} };
    var linhas = [];
    var poe = function (id, v) { Object.keys(v).forEach(function (k) { if (v[k] === null || v[k] === undefined) delete v[k]; }); linhas.push({ animal_id: id, valores: v }); antes.linhas[id] = Util.clonar(v); };
    despesa(det, origem, ev);
    if (ev.event_type === 'REPRODUCAO') {
      var r0 = (det.REPRODUCAO || [])[0] || {};
      origem.estacao_id = r0.estacao_id; origem.metodo = r0.metodo; origem.semen_identificacao = r0.semen_identificacao; origem.data_fim = r0.data_fim;
      var touroLinha = linhasEv.filter(function (l) { return l.papel === 'TOURO'; });
      if (sub === 'COBERTURA' || sub === 'INSEMINACAO') origem.touro_id = r0.touro_id;
      linhasEv.forEach(function (l) {
        if (l.papel === 'TOURO' && sub !== 'EXPOSICAO') return;
        var r = regs[l.animal_id] || {};
        poe(l.animal_id, { resultado: r.resultado, idade_gestacional_dias: r.idade_gestacional_dias ? String(r.idade_gestacional_dias) : null, data_prevista_parto: r.data_prevista_parto, observacoes: l.observacoes });
      });
      if (!touroLinha.length && sub === 'COBERTURA') origem.touro_id = r0.touro_id;
    } else if (ev.event_type === 'DESMAMA') {
      var sujeitos = linhasEv.filter(function (l) { return l.papel === 'SUJEITO'; });
      var destinos = sujeitos.map(function (l) { return l.pasto_destino_id; }).filter(Boolean);
      origem.pasto_destino_id = destinos.length ? destinos[0] : null;
      origem.metodo_pesagem = ((det.PESAGENS || [])[0] || {}).metodo || null;
      sujeitos.forEach(function (l) { poe(l.animal_id, { peso: typeof l.peso === 'number' ? String(l.peso).replace('.', ',') : null, observacoes: l.observacoes }); });
    } else {
      if (ev.event_type === 'CASTRACAO') origem.metodo = payload.metodo;
      if (ev.event_type === 'OCORRENCIA') origem.tipo_ocorrencia = payload.tipo_ocorrencia;
      linhasEv.forEach(function (l) { poe(l.animal_id, { observacoes: l.observacoes }); });
    }
    var campos = camposDoDef(def, sub, origem);
    antes.campos = Util.clonar(campos);
    return { subtipo: sub || undefined, campos: campos, linhas: linhas, origem: 'evento/' + ev.event_id, corrige: { event_id: ev.event_id, rotulo: Store.nomeEvento(ev.event_type, sub) + ' de ' + Fmt.data(ev.event_date), historico: ev.pre_marco_zero === true, antes: antes } };
  }

  Telas.registrar('reproducao/matrizes', { titulo: 'Reprodução', modulo: 'REPRODUCAO', montar: montarMatrizes });
  Telas.registrar('reproducao/indicadores', { titulo: 'Indicadores reprodutivos', modulo: 'REPRODUCAO', montar: montarIndicadores });
  Telas.registrar('reproducao/estacoes', { titulo: 'Estações de monta', modulo: 'REPRODUCAO', montar: montarEstacoes });
  Telas.registrar('reproducao/tronco', { titulo: 'Diagnóstico no tronco', modulo: 'REPRODUCAO', telaCheia: true, montar: montarTronco });
  return { blocoFicha: blocoFicha, previaCorrecao: previaCorrecao, lerResultado: lerResultado, textoPrevisao: textoPrevisao };
})();
</script>
