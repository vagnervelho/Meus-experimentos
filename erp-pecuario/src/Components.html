      var base = 'sel-f-' + Util.uuid().slice(0, 6);
      var fp = selectDe('Pasto', Store.pastos().map(function (p) { return { valor: p.pasture_id, rotulo: p.nome }; }), base + 'p');
      var fs = selectDe('Sexo', [{ valor: 'M', rotulo: 'Macho' }, { valor: 'F', rotulo: 'Fêmea' }], base + 's');
      var fc = selectDe('Categoria', Store.categorias().filter(function (c) { return c.ativo !== false; }).map(function (c) { return { valor: c.category_id, rotulo: c.nome }; }), base + 'c');
      var semBrinco = h('input', { type: 'checkbox', id: base + 'b' });
      var saida = h('div', { class: 'conferencia', role: 'status', 'aria-live': 'polite' });
      function filtrar() {
        var r = candidatos().filter(function (a) {
          return !elegivel(a) && (!fp.sel.value || a.pasto_atual_id === fp.sel.value) && (!fs.sel.value || a.sexo === fs.sel.value) && (!fc.sel.value || a.categoria_id === fc.sel.value) && (!semBrinco.checked || !a.brinco);
        });
        Util.limpar(saida);
        saida.appendChild(h('p', { class: 'dado', text: r.length + (r.length === 1 ? ' animal elegível com esses filtros' : ' animais elegíveis com esses filtros') }));
        if (r.length && varios) saida.appendChild(UI.botao('Incluir os ' + r.length + ' filtrados', { tipo: 'primario', aoClicar: function () { var n = adicionar(r.map(function (a) { return a.animal_id; })); UI.aviso(n + ' incluídos.', { tipo: 'ok' }); } }));
        saida.appendChild(listaCandidatos(r));
      }
      [fp.sel, fs.sel, fc.sel, semBrinco].forEach(function (x) { x.addEventListener('change', filtrar); });
      painel.appendChild(h('div', { class: 'grade-campos' }, fp.el, fs.el, fc.el, h('label', { class: 'marca', for: base + 'b' }, semBrinco, h('span', { text: 'Só os sem brinco' }))));
      painel.appendChild(saida);
      garantirBaixados(painel).then(function (ok) { if (ok) filtrar(); });
    }
    function painelPasto() {
      var base = 'sel-p-' + Util.uuid().slice(0, 6);
      var fp = selectDe('Pasto', Store.pastos().map(function (p) { return { valor: p.pasture_id, rotulo: p.nome + ' (' + (p.cabecas || 0) + ' cab.)' }; }), base);
      fp.sel.firstChild.textContent = 'Escolha o pasto…';
      var saida = h('div', { class: 'conferencia', role: 'status', 'aria-live': 'polite' });
      async function todos() {
        Util.limpar(saida);
        var p = fp.sel.value;
        if (!p) { saida.appendChild(UI.nota('Escolha o pasto.', 'aviso')); return; }
        var data = o.dataEvento ? o.dataEvento() : Fmt.hoje();
        var rotuloPos = null, achados;
        if (data && data !== Fmt.hoje()) {
          try {
            var r = await Cliente.consulta('inventario.elegiveis', { tipo: o.tipo, data: data, pasto: p });
            var lst = r.data.animais || r.data.itens || [];
            achados = lst.map(function (x) { return typeof x === 'string' ? x : x.animal_id; });
            rotuloPos = 'Posição em ' + Fmt.data(data) + ', conferida pelo servidor.';
          } catch (e) {
            if (e.code !== 'NOT_FOUND') { saida.appendChild(UI.estadoErro(e)); return; }
            rotuloPos = 'Lista com a posição de hoje: a consulta da posição em ' + Fmt.data(data) + ' ainda não está disponível. Ao gravar, o servidor confere cada animal na data.';
          }
        }
        if (!achados) achados = Store.animais().filter(function (a) { return a.pasto_atual_id === p && !elegivel(a); }).map(function (a) { return a.animal_id; });
        var n = adicionar(achados);
        saida.appendChild(UI.nota(n + ' de ' + achados.length + ' animais do pasto incluídos. Tire da lista as exceções.', 'ok'));
        if (rotuloPos) saida.appendChild(UI.nota(rotuloPos, 'info'));
      }
      painel.appendChild(h('div', { class: 'busca-linha' }, fp.el, UI.botao('Incluir todos', { tipo: 'primario', aoClicar: todos })));
      painel.appendChild(saida);
    }
    function painelColar() {
      var idc = 'sel-colar-' + Util.uuid().slice(0, 6);
      var ta = h('textarea', { id: idc, rows: 5, placeholder: '0457\n0391; 0388' });
      var saida = h('div', { class: 'conferencia', role: 'status', 'aria-live': 'polite' });
      function conferir() {
        Util.limpar(saida);
        var itens = ta.value.split(/[\n,;\t]+/).map(function (x) { return x.trim(); }).filter(Boolean);
        var achados = [], nao = [], repetidos = [], varios_ = [], vistos = {};
        var filtro = function (a) { return !elegivel(a); };
        itens.forEach(function (t) {
          var r = Store.resolverBrinco(t, filtro);
          if (r.modo === 'NENHUM') { nao.push(t); return; }
          if (r.modo === 'VARIOS') { varios_.push({ texto: t, candidatos: r.candidatos }); return; }
          var id = r.candidatos[0].animal_id;
          if (vistos[id] || ids.indexOf(id) >= 0) { repetidos.push(t); return; }
          vistos[id] = true;
          achados.push(id);
        });
        saida.appendChild(h('p', { class: 'dado', text: achados.length + ' achados · ' + nao.length + ' não encontrados · ' + repetidos.length + ' repetidos' }));
        if (nao.length) saida.appendChild(UI.nota('Não encontrados: ' + nao.join(', '), 'aviso'));
        if (repetidos.length) saida.appendChild(UI.nota('Repetidos ou já na lista: ' + repetidos.join(', '), 'info'));
        varios_.forEach(function (v) { saida.appendChild(h('p', { text: '"' + v.texto + '" serve para mais de um animal. Escolha:' })); saida.appendChild(listaCandidatos(v.candidatos)); });
        if (achados.length) saida.appendChild(UI.botao('Incluir os ' + achados.length + ' achados', { tipo: 'primario', aoClicar: function (ev) { adicionar(achados); ev.currentTarget.disabled = true; UI.aviso(achados.length + ' incluídos.', { tipo: 'ok' }); } }));
      }
      painel.appendChild(h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: idc, text: 'Cole os brincos (um por linha, ou separados por vírgula ou ponto e vírgula)' }), ta));
      painel.appendChild(UI.botao('Conferir a lista', { aoClicar: conferir }));
      painel.appendChild(saida);
      garantirBaixados(painel);
    }
    var modos = [['busca', 'Buscar']].concat(varios ? [['filtros', 'Filtros'], ['pasto', 'Todos do pasto'], ['colar', 'Colar lista']] : []);
    if (baixados) modos = modos.filter(function (m) { return m[0] !== 'pasto'; });
    var barraModos = h('div', { class: 'seletor-modos', role: 'group', 'aria-label': 'Como escolher os animais' }, modos.map(function (m) {
      var b = UI.botao(m[1], { aoClicar: function () { trocarModo(m[0]); } });
      b.setAttribute('aria-pressed', 'false');
      botoesModo[m[0]] = b;
      return b;
    }));
    el.appendChild(h('h3', { text: o.titulo || (varios ? 'Animais' : 'Animal') }));
    if (modos.length > 1) el.appendChild(barraModos);
    el.appendChild(painel);
    el.appendChild(contador);
    el.appendChild(lista);
    trocarModo('busca');
    desenharSelecionados();
    return {
      el: el,
      selecionados: function () { return ids.slice(); },
      definir: function (novos) { ids = novos.slice(); desenharSelecionados(); },
    };
  }
  return { criar: criar, motivoInelegivel: motivoInelegivel, precisaBaixados: precisaBaixados };
})();
