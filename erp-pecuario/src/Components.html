    res.aoMudarAnexos = desenhar;
    desenhar();
    el.appendChild(h('section', { 'aria-label': 'Documentos e fotos' }, h('h2', { text: 'Documentos e fotos' }), ul,
      h('p', { class: 'suave', text: 'Também dá para anexar depois, no detalhe do lançamento ("Ver evento").' })));
  }
  function resumoResultado(res) {
    var n = res.n;
    if (res.tipo === 'ESTORNO') return 'Evento estornado.';
    if (res.corrige) return 'Correção gravada: o lançamento original deixou de valer e este entrou no lugar' + (n ? ' (' + plural(n, 'animal', 'animais') + ').' : '.');
    if (res.tipo === 'ENTRADA_INICIAL' || res.tipo === 'OUTRA_ENTRADA') return n === 1 ? '1 animal entrou no rebanho.' : n + ' animais entraram no rebanho.';
    if (res.tipo === 'AJUSTE_INVENTARIO' && res.subtipo === 'DIVERGENCIA_CONTAGEM') return 'Baixa gravada: ' + plural(n, 'animal saiu', 'animais saíram') + ' do rebanho como não encontrado' + (n === 1 ? '' : 's') + ' na contagem.';
    if (res.tipo === 'AJUSTE_INVENTARIO' && res.subtipo === 'RECLASSIFICACAO') return 'Categoria mudada em ' + plural(n, 'animal', 'animais') + '.';
    if (res.tipo === 'AJUSTE_INVENTARIO') return n === 1 ? 'Correção gravada em 1 animal.' : 'Correção gravada em ' + n + ' animais.';
    if (res.tipo === 'IDENTIFICACAO') return (res.subtipo === 'REMOCAO' ? 'Identificação retirada de ' : res.subtipo === 'SUBSTITUICAO' ? 'Identificação trocada em ' : 'Identificação posta em ') + plural(n, 'animal', 'animais') + '.';
    if (res.tipo === 'MARCACAO') { var oque = res.subtipo === 'NAO_LOCALIZADO' ? 'não localizado' : 'para descarte'; return res.acao === 'DESMARCAR' ? plural(n, 'animal deixou', 'animais deixaram') + ' de estar marcado' + (n === 1 ? '' : 's') + ' ' + (res.subtipo === 'NAO_LOCALIZADO' ? 'como não localizado' + (n === 1 ? '' : 's') : 'para descarte') + '.' : plural(n, 'animal marcado', 'animais marcados') + ' ' + (res.subtipo === 'NAO_LOCALIZADO' ? 'como ' + oque + (n === 1 ? '' : 's') : oque) + '.'; }
    if (res.tipo === 'NASCIMENTO') { var c = Math.max(0, n - 1); return c ? 'Parto gravado: ' + plural(c, 'cria entrou', 'crias entraram') + ' no rebanho.' : 'Parto gravado (sem cria viva).'; }
    if (res.tipo === 'TRANSFERENCIA') return n === 1 ? '1 animal transferido.' : n + ' animais transferidos.';
    if (res.tipo === 'MORTE') return n === 1 ? 'Morte registrada: 1 animal saiu do rebanho.' : 'Morte registrada: ' + n + ' animais saíram do rebanho.';
    if (res.tipo === 'DESCARTE') return n === 1 ? 'Descarte registrado: 1 animal saiu do rebanho.' : 'Descarte registrado: ' + n + ' animais saíram do rebanho.';
    if (res.tipo === 'COMPRA') return 'Compra gravada: ' + (n === 1 ? '1 animal entrou' : n + ' animais entraram') + ' no rebanho' + (res.data && res.data.total_value ? ', custo total de ' + Fmt.dinheiro(res.data.total_value) : '') + '.';
    if (res.tipo === 'VENDA') return 'Venda gravada: ' + (n === 1 ? '1 animal saiu' : n + ' animais saíram') + ' do rebanho' + (res.data && res.data.total_value ? ', valor bruto de ' + Fmt.dinheiro(res.data.total_value) : '') + '.';
    return res.def.rotulo + ' gravado' + (n ? ' com ' + plural(n, 'animal', 'animais') : '') + '.';
  }
  /** Tela de resultado persistente (08, 4.6): o que foi gravado, com Ver evento · Registrar outro · Desfazer. */
  function montarResultado(el, s) {
    var res = s.resultado;
    var d = res.data || {};
    var caixa = h('div', { class: 'estado estado-ok', dataset: { resultado: res.tipo } },
      h('div', { class: 'estado-titulo' }, UI.icone('ok'), h('h1', { style: 'margin:0', text: res.tipo === 'ESTORNO' ? 'Estornado' : 'Gravado' })),
      h('p', { class: 'resultado-numero', text: resumoResultado(res) }));
    if (res.duplicado && !res.verificado) caixa.appendChild(UI.nota('Já estava gravado; nada foi duplicado.', 'info'));
    if (res.verificado) caixa.appendChild(UI.nota('A resposta demorou, mas o servidor confirmou a gravação.', 'ok'));
    if (res.falhaAtualizar) caixa.appendChild(UI.nota('Gravado. A lista do rebanho deste aparelho não pôde ser atualizada agora (' + res.falhaAtualizar + '); ela se atualiza na próxima abertura.', 'aviso'));
    if (d.event_date) caixa.appendChild(h('p', { text: 'Data: ' + Fmt.data(d.event_date) }));
    if (res.anexos && res.anexos.length) blocoAnexosResultado(caixa, res);
    if (d.animais && d.animais.length) {
      caixa.appendChild(h('ul', { class: 'lista-simples' }, d.animais.slice(0, 20).map(function (a) {
        var p = a.pasto_atual_id ? Store.pasto(a.pasto_atual_id) : null;
        return h('li', null, h('span', { class: 'dado', text: a.brinco || a.codigo_interno }), ' · ' + (a.codigo_interno || '') + (p ? ' · ' + p.nome : '') + ' · ' + Fmt.rotulo('SITUACAO_CADASTRAL', a.situacao_cadastral));
      }), d.animais.length > 20 ? h('li', { class: 'suave', text: 'e mais ' + (d.animais.length - 20) + '.' }) : null));
    }
    var acoes = h('div', { class: 'acoes' });
    if (d.event_id && Telas.existe('evento/' + d.event_id)) acoes.appendChild(UI.botao('Ver evento', { aoClicar: function () { Roteador.ir('evento/' + d.event_id); } }));
    if (res.tipo !== 'ESTORNO') acoes.appendChild(UI.botao('Registrar outro', { tipo: 'primario', aoClicar: function () { s.resultado = null; Roteador.ir(rotaDoForm(res.tipo), { substituir: true, forcar: true }); } }));
    // Desfazer uma correção estornaria o substituto e apagaria o lançamento inteiro (o original não volta): na correção,
    // o caminho é abrir o evento e corrigir de novo, ou estornar com a revisão que avisa disso.
    if (res.tipo !== 'ESTORNO' && !res.corrige && d.event_id && Store.tipoEvento('ESTORNO')) acoes.appendChild(UI.botao('Desfazer', { aoClicar: function () {
      var rot = {};
      rot[d.event_id] = res.def.rotulo + ' de ' + Fmt.data(d.event_date) + (res.n ? ' (' + plural(res.n, 'animal', 'animais') + ')' : '');
      abrir('ESTORNO', { campos: { event_id: d.event_id }, rotulos: rot, origem: 'evento/novo' });
    } }));
    acoes.appendChild(UI.botao('Ir para o início', { tipo: 'texto', aoClicar: function () { s.resultado = null; Roteador.ir(App.rotaInicial()); } }));
    caixa.appendChild(acoes);
    el.appendChild(caixa);
  }

  // ------------------------------------------------------------------ envio pendente ----
  /** Rascunho que ficou ENVIANDO (sem resposta, aba fechada): pergunta ao servidor antes de qualquer outra coisa. */
  async function retomarEnvio(s) {
    var sit = await Cliente.verificar(s.chave);
    if (sit.situacao === 'CONFIRMADA' && s.envio) {
      var r = await Cliente.comando(s.envio.rota, s.envio.dados, { chave: s.chave, avisosAceitos: s.envio.avisosAceitos, dataVersionEsperada: s.envio.dataVersionEsperada });
      r.verificado = true;
      await concluir(s, r);
      return 'CONFIRMADA';
    }
    s.estado = 'EDITANDO';
    s.envio = null;
    await salvarRascunho(s);
    return sit.situacao;
  }
  function descricaoRascunho(r) {
    var p = [r.rotulo || r.tipo];
    if (r.data) p.push('de ' + Fmt.dataCurta(r.data));
    var t = p.join(' ') + ' — registro não concluído';
    if (r.n) t += ' (' + plural(r.n, 'animal', 'animais') + ')';
    return t;
  }
  /** Na abertura do app: confere os envios pendentes e anuncia os rascunhos (08, seção 9). */
  async function conferirPendentes() {
    var lista;
    try {
      lista = await Rascunhos.listar();
    } catch (e) {
      App.faixa('rascunhos', { tipo: 'aviso', texto: 'Não foi possível ler os rascunhos guardados: ' + e.message });
      return;
    }
    for (var i = 0; i < lista.length; i++) {
      var r = lista[i];
      var def = Store.tipoEvento(r.tipo);
      if (!def || r.estado !== 'ENVIANDO') continue;
      var idF = 'envio-' + r.tipo;
      App.faixa(idF, { tipo: 'info', texto: (r.rotulo || r.tipo) + ': verificando se gravou…' });
      try {
        var s = await sessao(r.tipo, def);
        var sit = await retomarEnvio(s);
        if (sit === 'CONFIRMADA') App.faixa(idF, { tipo: 'ok', texto: (r.rotulo || r.tipo) + ' de ' + Fmt.instante(r.salvo_em) + ': o servidor confirmou que foi gravado.', acoes: [{ texto: 'Ver resultado', aoClicar: function (tipo) { return function () { App.removerFaixa('envio-' + tipo); Roteador.ir(rotaDoForm(tipo) + '/resultado'); }; }(r.tipo) }] });
        else App.faixa(idF, { tipo: 'erro', texto: (r.rotulo || r.tipo) + ' de ' + Fmt.instante(r.salvo_em) + ' não foi gravado.', acoes: [{ texto: 'Enviar de novo', aoClicar: function (tipo) { return function () { App.removerFaixa('envio-' + tipo); Roteador.ir(rotaDoForm(tipo)); }; }(r.tipo) }] });
      } catch (e) {
        App.faixa(idF, { tipo: 'aviso', texto: (r.rotulo || r.tipo) + ': ainda não sabemos se gravou (' + e.message + ').', acoes: [{ texto: 'Verificar de novo', aoClicar: function () { conferirPendentes(); } }] });
      }
    }
    var abertos = lista.filter(function (x) { return x.estado !== 'ENVIANDO' && Store.tipoEvento(x.tipo); });
    try {
      abertos = (await Rascunhos.listar()).filter(function (x) { return x.estado !== 'ENVIANDO' && Store.tipoEvento(x.tipo); });
    } catch (e) {
      Util.registrarFalha('releitura dos rascunhos', e);
    }
    abertos.forEach(function (r) {
      App.faixa('rascunho-' + r.tipo, { tipo: 'aviso', texto: descricaoRascunho(r), acoes: [
        { texto: 'Continuar', aoClicar: function () { App.removerFaixa('rascunho-' + r.tipo); Roteador.ir(rotaDoForm(r.tipo)); } },
        { texto: 'Descartar', aoClicar: async function () {
          var ok = await UI.confirmar({ titulo: 'Descartar o rascunho?', texto: descricaoRascunho(r) + '. O que foi digitado será apagado.', verbo: 'Descartar o rascunho', cancelar: 'Manter', perigo: true });
          if (!ok) return;
          await descartar(r.tipo);
          App.removerFaixa('rascunho-' + r.tipo);
          UI.aviso('Rascunho descartado.', { tipo: 'info' });
        } },
      ] });
    });
  }

  // ------------------------------------------------------------------ telas ----
  function montarSeletorTipo(el) {
    el.appendChild(h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Registrar evento' })));
    var pend = h('div');
    el.appendChild(pend);
    Rascunhos.listar().then(function (lista) {
      var abertos = lista.filter(function (r) { return Store.tipoEvento(r.tipo); });
      if (!abertos.length || !el.isConnected) return;
      pend.appendChild(h('section', { class: 'cartao', 'aria-label': 'Registros não concluídos' }, h('h2', { text: 'Não concluídos' }), h('ul', { class: 'lista-simples' }, abertos.map(function (r) {
        return h('li', { class: 'linha-acao' }, h('span', { text: descricaoRascunho(r) + (r.estado === 'ENVIANDO' ? ' · verificando se gravou' : '') }), h('a', { class: 'botao botao-secundario', href: Roteador.href(rotaDoForm(r.tipo)), dataset: { rota: rotaDoForm(r.tipo) } }, 'Continuar'));
      }))));
    }, function (e) { pend.appendChild(UI.nota('Não foi possível ler os rascunhos: ' + e.message, 'aviso')); });
    var tipos = (Store.catalogo().tipos || []).filter(function (t) { return t.tipo !== 'ESTORNO'; });
    if (!tipos.length) { el.appendChild(UI.vazio({ texto: 'Nenhum tipo de registro disponível nesta fase.' })); return; }
    var link = function (t) { return h('li', null, h('a', { class: 'botao botao-secundario botao-bloco', href: Roteador.href(rotaDoForm(t.tipo)), dataset: { rota: rotaDoForm(t.tipo), tipoEvento: t.tipo } }, t.rotulo)); };
    var freq = tipos.filter(function (t) { return t.frequente; }).sort(function (a, b) { return a.ordem - b.ordem; });
    if (freq.length) el.appendChild(h('section', { class: 'cartao' }, h('h2', { text: 'Mais usados' }), h('ul', { class: 'lista-simples' }, freq.map(link))));
    GRUPOS.forEach(function (g) {
      var doGrupo = tipos.filter(function (t) { return t.grupo_ui === g; }).sort(function (a, b) { return a.ordem - b.ordem; });
      if (doGrupo.length) el.appendChild(h('section', { class: 'cartao', dataset: { grupo: g } }, h('h2', { text: g }), h('ul', { class: 'lista-simples' }, doGrupo.map(link))));
    });
  }
  function montarTipo(el, p) {
    var tipo = p.tipo, etapa = p.etapa;
    var def = Store.tipoEvento(tipo);
    if (!def) {
      el.appendChild(UI.estadoErro({ code: 'NOT_FOUND', message: 'Este tipo de registro não está disponível nesta fase do sistema.' }, { acao: { texto: 'Escolher outro registro', aoClicar: function () { Roteador.ir('evento/novo'); } } }));
      return null;
    }
    var vivo = true;
    el.appendChild(UI.carregando('Abrindo o formulário…'));
    sessao(tipo, def).then(async function (s) {
      if (!vivo) return;
      if (s.estado === 'ENVIANDO' && etapa !== 'resultado') {
        Util.limpar(el);
        el.appendChild(UI.carregando('Verificando se o último envio deste formulário foi gravado…'));
        try {
          var sit = await retomarEnvio(s);
          if (sit === 'CONFIRMADA') return;
        } catch (e) {
          if (!vivo) return;
          Util.limpar(el);
          el.appendChild(UI.estadoErro(e, { acao: { texto: 'Verificar de novo', aoClicar: function () { Roteador.ir(rotaDoForm(tipo), { forcar: true, substituir: true }); } } }));
          return;
        }
        if (!vivo) return;
      }
      Util.limpar(el);
      if (etapa === 'resultado') {
        if (sessoes[tipo] && sessoes[tipo].resultado) montarResultado(el, sessoes[tipo]);
        else Roteador.ir(rotaDoForm(tipo), { substituir: true });
        return;
      }
      if (!s.view || !s.view.el) montarFormulario(s);
      el.appendChild(s.view.el);
      if (etapa === 'revisao') {
        if (s.dados) mostrarRevisao(s);
        else Roteador.ir(rotaDoForm(tipo), { substituir: true });
        return;
      }
      var titulo = s.view.el.querySelector('h1');
      if (titulo && (!document.activeElement || document.activeElement === document.body || !document.activeElement.isConnected)) { titulo.setAttribute('tabindex', '-1'); titulo.focus(); }
    }, function (e) {
      if (!vivo) return;
      Util.limpar(el);
      el.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: function () { Roteador.ir(rotaDoForm(tipo), { forcar: true, substituir: true }); } } }));
    });
    return function () {
      vivo = false;
      var s = sessoes[tipo];
      if (!s) return;
      if (s.salvarAdiado.pendente()) s.salvarAdiado.agora();
      if (Roteador.atual().indexOf(rotaDoForm(tipo)) !== 0 && s.alterado && !s.resultado) UI.aviso(Rascunhos.modo() === 'SERVIDOR' ? 'Rascunho guardado no servidor. Continue depois pelo Registrar.' : 'Rascunho guardado neste aparelho. Continue depois pelo Registrar.', { tipo: 'info' });
    };
  }
  Telas.registrar('evento/novo', { titulo: 'Registrar evento', telaCheia: true, montar: montarSeletorTipo });
  Telas.registrar('evento/novo/:tipo/:etapa?', { titulo: 'Registrar evento', telaCheia: true, montar: montarTipo });

  return {
    abrir: abrir, conferirPendentes: conferirPendentes, descartar: descartar, montarDados: montarDados, mapearErros: mapearErros,
    serieBrincos: serieBrincos, lerColagem: lerColagem, vencimentos: vencimentos, diferencas: diferencas, impactosServidor: impactosServidor,
    sessao: function (tipo) { return sessoes[tipo] || null; }, descricaoRascunho: descricaoRascunho,
    PRINCIPAIS_ANIMAL: PRINCIPAIS_ANIMAL, PRINCIPAIS_COMPRA: PRINCIPAIS_COMPRA, CAMPOS_VOLTA: CAMPOS_VOLTA, CAMPOS_VOLTA_COMPRA: CAMPOS_VOLTA_COMPRA,
  };
})();
</script>
