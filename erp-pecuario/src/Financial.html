<script>
'use strict';
/*
 * ERP Pecuário — Financeiro (Fase 4), carregado sob demanda (01, seção 6.2; CONTRATOS, seções 37 e 55). Etapa BASE: a lista
 * dos lançamentos que já existem (os das compras, vendas, mortes, descartes, aberturas, sanidade e estoque, desde a Fase 2),
 * com os filtros, e o detalhe de cada um: a conta e a natureza, a competência, as parcelas com a situação de hoje, o rateio
 * entre os animais e o que ficou sem alocar, o lançamento que o criou e o que o anulou (08, seção 3, "Financeiro:
 * lançamentos").
 *
 * Todo número vem pronto do servidor (P5; CONTRATOS, seção 51): os totais do filtro, as páginas, o valor em aberto e o
 * vencido, a situação de cada parcela e os dias de atraso, o alocado e o não alocado. A tela só filtra, mostra e leva ao
 * lançamento de origem.
 */
/**
 * Baixa — as folhas da baixa (uma parcela ou várias, inteira ou em parte, com juros, multa e desconto), do desfazer e do
 * "Dividir" (parcela.baixar, parcela.desfazerBaixa, parcela.desdobrar; CONTRATOS, seção 56). A conferência do valor pago, do
 * depósito esperado e do que resta é do servidor (parcela.simular): a tela só mostra.
 */
var Baixa = (function () {
  var h = Util.h;
  /** A prévia do servidor (o mesmo tratador, sem gravar) num nó. */
  async function previa(saida, acao, dados) {
    Util.limpar(saida);
    saida.appendChild(UI.carregando('Conferindo no servidor…'));
    try {
      var r = (await Cliente.consulta('parcela.simular', { acao: acao, dados: dados })).data.impactos;
      Util.limpar(saida);
      if (acao === 'baixar') {
        saida.appendChild(UI.pares(r.itens.map(function (x) {
          var t = Fmt.dinheiro(x.valor_pago) + (x.parcial ? ' (resta ' + Fmt.dinheiro(x.resta.valor) + ' para ' + Fmt.data(x.resta.data_vencimento) + ')' : '') + (x.encontro.length ? ' · depósito esperado ' + Fmt.dinheiro(x.deposito) : '');
          return [x.lancamento + ' (' + x.parcela_num + ')', t];
        }).concat([['Total', 'entradas ' + Fmt.dinheiro(r.entradas) + ' · saídas ' + Fmt.dinheiro(r.saidas)]]), 'resumo-revisao'));
      } else if (acao === 'desdobrar') {
        saida.appendChild(UI.pares(r.novas.map(function (x) { return [Fmt.data(x.data_vencimento), Fmt.dinheiro(x.valor)]; }), 'resumo-revisao'));
      }
    } catch (e) {
      Util.limpar(saida);
      saida.appendChild(UI.estadoErro(e, { detalhes: e.details || [] }));
    }
  }
  /** Baixa de uma ou várias parcelas (a mesma data e a mesma forma). itens: [{parcela_id, lancamento, valor, data_vencimento, tipo}]. */
  function baixar(itens, origem, aoFim) {
    var um = itens.length === 1;
    var defs = [
      { id: 'data_pagamento', rotulo: 'Data do pagamento (ou do recebimento)', tipo: 'data', obrigatorio: true, default: 'HOJE' },
      { id: 'forma_pagamento', rotulo: 'Forma (caixa, PIX, transferência…)', tipo: 'lista', lista: 'FORMA_PAGAMENTO' },
    ];
    // A baixa em parte só no título que o servidor diz que se divide (acoes.parcial, parcelas_livres); nos outros, a parcela inteira.
    if (um && itens[0].parcial !== false) defs.push({ id: 'valor', rotulo: 'Valor baixado (vazio = a parcela inteira)', tipo: 'dinheiro', min: 0.01, ajuda: 'Menos que a parcela: a baixa é em parte, e o resto fica em aberto com o mesmo vencimento.' });
    if (um) {
      defs.push({ id: 'juros_multa', rotulo: 'Juros e multa', tipo: 'dinheiro', min: 0 });
      defs.push({ id: 'desconto', rotulo: 'Desconto', tipo: 'dinheiro', min: 0 });
    }
    defs.push({ id: 'justificativa', rotulo: 'Justificativa (só no período financeiro fechado)', tipo: 'texto' });
    var saida = h('div', { dataset: { previaBaixa: '1' } });
    var montar = function (v) {
      var d = { data_pagamento: v.data_pagamento, forma_pagamento: v.forma_pagamento, justificativa: v.justificativa };
      if (um) { d.parcela_id = itens[0].parcela_id; d.valor = v.valor; d.juros_multa = v.juros_multa; d.desconto = v.desconto; }
      else d.itens = itens.map(function (x) { return { parcela_id: x.parcela_id }; });
      return d;
    };
    var extra = h('div', null, h('p', { class: 'dado', text: um ? itens[0].lancamento + ' · vence em ' + Fmt.data(itens[0].data_vencimento) + ' · ' + Fmt.dinheiro(itens[0].valor) : itens.length + ' parcelas marcadas' }), saida);
    var f = Cadastro.folha({ titulo: um ? (itens[0].tipo === 'RECEITA' ? 'Receber a parcela' : 'Pagar a parcela') : 'Dar baixa em ' + itens.length + ' parcelas', rota: 'parcela.baixar', origem: origem, idBase: 'bx', defs: defs, extra: extra, verbo: 'Dar baixa',
      montar: montar, sucesso: function (d) { return (d && d.parcelas ? d.parcelas.length : itens.length) > 1 ? 'Baixas gravadas.' : 'Baixa gravada.'; }, aoSalvar: function () { if (aoFim) aoFim(); } });
    extra.appendChild(h('div', { class: 'acoes' }, UI.botao('Conferir o valor pago', { atributos: { 'data-conferir-baixa': '1' }, aoClicar: function () {
      var c = f.bloco.converter();
      if (c.erros.length) { f.bloco.focarPrimeiroErro(); return; }
      previa(saida, 'baixar', montar(c.valores));
    } })));
    return f;
  }
  /** Desfazer a baixa de uma parcela (com a justificativa; no recebimento da venda, a dedução retida volta junto). */
  function desfazer(item, origem, aoFim) {
    return Cadastro.folha({ titulo: 'Desfazer a baixa', rota: 'parcela.desfazerBaixa', origem: origem, idBase: 'dbx', perigo: true, verbo: 'Desfazer a baixa',
      defs: [{ id: 'justificativa', rotulo: 'Por que desfazer', tipo: 'texto', obrigatorio: true }],
      extra: UI.nota(item.lancamento + ' · ' + Fmt.dinheiro(item.valor) + ': a parcela volta a ficar em aberto.', 'aviso'),
      montar: function (v) { return { parcela_id: item.parcela_id, justificativa: v.justificativa }; },
      sucesso: function () { return 'Baixa desfeita.'; }, aoSalvar: function () { if (aoFim) aoFim(); } });
  }
  /** Dividir ou remarcar uma parcela em aberto: em N parcelas iguais, com os vencimentos que o servidor calcula. */
  function dividir(item, origem, aoFim) {
    var saida = h('div', { dataset: { previaDivisao: '1' } });
    var defs = [
      { id: 'quantas', rotulo: 'Em quantas parcelas', tipo: 'inteiro', obrigatorio: true, min: 1, max: 120, default: 2 },
      { id: 'primeiro', rotulo: 'Vencimento da primeira', tipo: 'data', obrigatorio: true },
      { id: 'intervalo', rotulo: 'As outras vencem', tipo: 'lista', obrigatorio: true, opcoes: ['MES', 'D30', 'D15', 'D7'], rotulos_opcoes: ['Todo mês, no mesmo dia', 'A cada 30 dias', 'A cada 15 dias', 'Toda semana'], default: 'MES' },
      { id: 'justificativa', rotulo: 'Por que dividir ou remarcar', tipo: 'texto', obrigatorio: true },
    ];
    var montar = function (v) { return { parcela_id: item.parcela_id, quantas: v.quantas, primeiro: v.primeiro, intervalo: v.intervalo, justificativa: v.justificativa }; };
    var extra = h('div', null, UI.nota(item.lancamento + ' · ' + Fmt.dinheiro(item.valor) + ' com vencimento em ' + Fmt.data(item.data_vencimento) + ': as parcelas novas somam o mesmo (o servidor divide em partes iguais).', 'info'), saida);
    var f = Cadastro.folha({ titulo: 'Dividir a parcela', rota: 'parcela.desdobrar', origem: origem, idBase: 'dvp', defs: defs, extra: extra, verbo: 'Dividir',
      montar: montar, sucesso: function () { return 'Parcela dividida.'; }, aoSalvar: function () { if (aoFim) aoFim(); } });
    extra.appendChild(h('div', { class: 'acoes' }, UI.botao('Ver as parcelas novas', { atributos: { 'data-conferir-divisao': '1' }, aoClicar: function () {
      var c = f.bloco.converter();
      if (c.erros.length) { f.bloco.focarPrimeiroErro(); return; }
      previa(saida, 'desdobrar', montar(c.valores));
    } })));
    return f;
  }
  return { baixar: baixar, desfazer: desfazer, dividir: dividir };
})();

var TelaFinanceiro = (function () {
  var h = Util.h;
  /** A parcela na linguagem do pecuarista (o servidor manda a situação de hoje; 03b, seção 10.4). */
  var SITUACAO_PARCELA = {
    PAGA: 'Paga', RECEBIDA: 'Recebida', A_PAGAR: 'A pagar', A_RECEBER: 'A receber', VENCIDA: 'Vencida',
    SUBSTITUIDA: 'Substituída (baixa em parte)', SEM_EFEITO: 'Sem efeito (lançamento cancelado)',
  };
  var SITUACOES = [['ATIVO', 'Os que valem'], ['CANCELADO', 'Os cancelados'], ['TODOS', 'Todos']];
  var PAGAMENTOS = [['', 'Qualquer'], ['ABERTO', 'Em aberto'], ['PARCIAL', 'Pago em parte'], ['LIQUIDADO', 'Pago'], ['SEM_CAIXA', 'Sem pagamento (não é caixa)']];
  var filtros = { de: '', ate: '', tipo: '', natureza: '', conta_id: '', partner_id: '', pasture_id: '', situacao: 'ATIVO', status_pagamento: '', busca: '', pagina: 1 };

  function campo(id, rotulo, controle) {
    return h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: id, text: rotulo }), controle);
  }
  function link(rota, texto) { return h('a', { class: 'botao botao-texto', href: Roteador.href(rota), dataset: { rota: rota } }, texto); }
  function selecao(id, opcoes, valor) {
    return h('select', { id: id }, opcoes.map(function (o) { return h('option', { value: o[0], text: o[1], selected: o[0] === valor }); }));
  }
  function competencia(l) {
    return l.competencia_inicio ? Fmt.data(l.competencia_inicio) + ' a ' + Fmt.data(l.competencia_fim) : Fmt.data(l.data_competencia);
  }
  function situacao(l) {
    return l.situacao === 'CANCELADO' ? 'Cancelado' : Fmt.rotulo('STATUS_PAGAMENTO', l.status_pagamento);
  }
  function origem(l) {
    return l.event_type ? l.rotulo_evento + ' de ' + Fmt.data(l.event_date) : '—';
  }
  function nomeLancamento(l) { return l.descricao || l.conta_nome || Fmt.rotulo('NATUREZA', l.natureza); }

  // ------------------------------------------------------------------ lista ----
  /** O cabeçalho do módulo: o título, "Novo lançamento" (o formulário do catálogo) e as abas das partes do Financeiro. */
  function cabecalho(el, atual) {
    var novo = App.podeRegistrar() && Store.tipoEvento('LANCAMENTO_FINANCEIRO') ? h('a', { class: 'botao botao-primario', href: Roteador.href('evento/novo/LANCAMENTO_FINANCEIRO'), dataset: { rota: 'evento/novo/LANCAMENTO_FINANCEIRO', novoLancamento: '1' } }, 'Novo lançamento') : null;
    el.appendChild(h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Financeiro' }), novo));
    el.appendChild(UI.abas('Partes do Financeiro', [
      { rotulo: 'Lançamentos', rota: 'financeiro/lancamentos', atual: atual === 'lancamentos' },
      { rotulo: 'A pagar e a receber', rota: 'financeiro/titulos', atual: atual === 'titulos' },
      { rotulo: 'Fluxo de caixa', rota: 'financeiro/fluxo', atual: atual === 'fluxo' },
      { rotulo: 'Resultado', rota: 'financeiro/resultado', atual: atual === 'resultado' },
      { rotulo: 'Custos', rota: 'financeiro/custos', atual: atual === 'custos' },
    ]));
  }
  function montarLista(el) {
    var vivo = true;
    cabecalho(el, 'lancamentos');
    el.appendChild(UI.nota('Os lançamentos avulsos (combustível, salário, arrendamento, aporte) e os das compras, vendas, mortes, descartes, aberturas do rebanho, aplicações e entradas de estoque. Para mudar um deles, abra o lançamento de origem e corrija ou estorne.', 'info'));
    var de = h('input', { type: 'date', id: 'fin-de', value: filtros.de });
    var ate = h('input', { type: 'date', id: 'fin-ate', value: filtros.ate });
    var tipo = selecao('fin-tipo', [['', 'Receitas e despesas'], ['RECEITA', 'Só receitas'], ['DESPESA', 'Só despesas']], filtros.tipo);
    var natureza = selecao('fin-natureza', [['', 'Todas']].concat(Object.keys(Fmt.ROTULOS.NATUREZA).map(function (k) { return [k, Fmt.ROTULOS.NATUREZA[k]]; })), filtros.natureza);
    var conta = selecao('fin-conta', [['', 'Todas']].concat(Store.contas().map(function (c) { return [c.conta_id, c.nome]; })), filtros.conta_id);
    var parceiro = selecao('fin-parceiro', [['', 'Todos']].concat(Store.parceiros().map(function (p) { return [p.partner_id, p.nome]; })), filtros.partner_id);
    var pasto = selecao('fin-pasto', [['', 'Todos']].concat(Store.pastos({ todos: true }).map(function (p) { return [p.pasture_id, p.nome]; })), filtros.pasture_id);
    var sit = selecao('fin-situacao', SITUACOES, filtros.situacao);
    var pag = selecao('fin-pagamento', PAGAMENTOS, filtros.status_pagamento);
    var busca = h('input', { type: 'search', id: 'fin-busca', value: filtros.busca, autocomplete: 'off', placeholder: 'descrição ou documento' });
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Filtrar lançamentos', on: { submit: function (ev) { ev.preventDefault(); filtros.pagina = 1; carregar(); } } },
      campo('fin-de', 'Competência de', de), campo('fin-ate', 'até', ate), campo('fin-tipo', 'Tipo', tipo), campo('fin-natureza', 'Natureza', natureza),
      campo('fin-conta', 'Conta', conta), campo('fin-parceiro', 'Parceiro', parceiro), campo('fin-pasto', 'Pasto', pasto),
      campo('fin-situacao', 'Situação', sit), campo('fin-pagamento', 'Pagamento', pag), campo('fin-busca', 'Buscar', busca),
      UI.botao('Filtrar', { tipo: 'primario', atributos: { type: 'submit' } })));
    var resumo = h('p', { class: 'dado', role: 'status', dataset: { resumoFinanceiro: '1' } });
    var corpo = h('div');
    el.appendChild(resumo);
    el.appendChild(corpo);
    async function carregar() {
      filtros.de = de.value; filtros.ate = ate.value; filtros.tipo = tipo.value; filtros.natureza = natureza.value; filtros.conta_id = conta.value;
      filtros.partner_id = parceiro.value; filtros.pasture_id = pasto.value; filtros.situacao = sit.value; filtros.status_pagamento = pag.value; filtros.busca = busca.value.trim();
      Util.limpar(corpo);
      resumo.textContent = '';
      corpo.appendChild(UI.carregando('Buscando os lançamentos…'));
      try {
        var q = { pagina: filtros.pagina, situacao: filtros.situacao };
        ['de', 'ate', 'tipo', 'natureza', 'conta_id', 'partner_id', 'pasture_id', 'status_pagamento', 'busca'].forEach(function (k) { if (filtros[k]) q[k] = filtros[k]; });
        var r = (await Cliente.consulta('financeiro.lancamentos', q)).data;
        if (!vivo) return;
        Util.limpar(corpo);
        resumo.textContent = r.total + (r.total === 1 ? ' lançamento' : ' lançamentos') + ' · receitas ' + Fmt.dinheiro(r.totais.receitas) + ' · despesas ' + Fmt.dinheiro(r.totais.despesas);
        corpo.appendChild(UI.tabela({
          id: 'lancamentos', rotulo: 'Lançamentos financeiros', linhas: r.itens, chave: function (l) { return l.financial_id; }, porPagina: r.por_pagina, semPaginacao: true,
          vazio: { texto: 'Nenhum lançamento com esses filtros.' },
          colunas: [
            { id: 'data_competencia', rotulo: 'Competência', formatar: competencia },
            { id: 'descricao', rotulo: 'Lançamento', valor: nomeLancamento, formatar: function (l) { return link('financeiro/lancamento/' + l.financial_id, nomeLancamento(l)); } },
            { id: 'conta_nome', rotulo: 'Conta' },
            { id: 'tipo', rotulo: 'Tipo', valor: function (l) { return l.tipo === 'RECEITA' ? 'Receita' : 'Despesa'; } },
            { id: 'valor', rotulo: 'Valor', num: true, formatar: function (l) { return Fmt.dinheiro(l.valor); } },
            { id: 'situacao', rotulo: 'Situação', valor: situacao },
            { id: 'parceiro', rotulo: 'Parceiro' },
            { id: 'origem', rotulo: 'Origem', valor: origem },
            { id: 'nao_alocado', rotulo: 'Sem alocar aos animais', num: true, formatar: function (l) { return l.nao_alocado === null ? '—' : Fmt.dinheiro(l.nao_alocado); } },
          ],
        }).el);
        if (r.paginas > 1) {
          corpo.appendChild(h('div', { class: 'paginacao' }, h('span', { class: 'suave', text: 'Página ' + r.pagina + ' de ' + r.paginas }), h('div', { class: 'acoes', style: 'margin-top:0' },
            UI.botao('Anterior', { desabilitado: r.pagina <= 1, aoClicar: function () { filtros.pagina = r.pagina - 1; carregar(); } }),
            UI.botao('Próxima', { desabilitado: r.pagina >= r.paginas, aoClicar: function () { filtros.pagina = r.pagina + 1; carregar(); } }))));
        }
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
      }
    }
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ detalhe ----
  function nomeAnimal(a) { return a.brinco || a.codigo_interno || 'animal'; }
  function linkEvento(e) { return e ? link('evento/' + e.event_id, e.rotulo + ' de ' + Fmt.data(e.event_date) + (e.vigente ? '' : ' (não vale mais)')) : null; }
  /** As ações de uma parcela no detalhe (só no lançamento que vale e fora da dedução retida, que vai com o recebimento). */
  function acoesParcela(l, x, recarregar, livres) {
    if (l.situacao !== 'ATIVO' || l.retida_pelo_comprador || !App.podeRegistrar()) return '—';
    var paga = x.situacao === 'PAGA' || x.situacao === 'RECEBIDA';
    var aberta = x.situacao === 'A_PAGAR' || x.situacao === 'A_RECEBER' || x.situacao === 'VENCIDA';
    var item = { parcela_id: x.parcela_id, lancamento: nomeLancamento(l), valor: x.valor, data_vencimento: x.data_vencimento, tipo: l.tipo, parcial: livres === true };
    if (paga) return UI.botao('Desfazer baixa', { atributos: { 'data-desfazer': x.parcela_id }, aoClicar: function (ev) { Baixa.desfazer(item, ev.currentTarget, recarregar); } });
    if (!aberta) return '—';
    return h('div', { class: 'acoes', style: 'margin-top:0' },
      UI.botao(l.tipo === 'RECEITA' ? 'Receber' : 'Pagar', { atributos: { 'data-baixar': x.parcela_id }, aoClicar: function (ev) { Baixa.baixar([item], ev.currentTarget, recarregar); } }),
      livres ? UI.botao('Dividir', { atributos: { 'data-dividir': x.parcela_id }, aoClicar: function (ev) { Baixa.dividir(item, ev.currentTarget, recarregar); } }) : null);
  }
  // ------------------------------------------------------------------ rateio (E4.3) ----
  /**
   * Ratear o lançamento entre os animais (Fase 4, E4.3; CONTRATOS, seção 57): abre o formulário do evento RATEIO com o que
   * o servidor propôs (financeiro.lancamento → ratear.padrao: o escopo e o critério que o lançamento admite, o pasto e a
   * categoria dele). A prévia e o valor de cada animal vêm da simulação do servidor; a tela não divide nada.
   */
  function botaoRatear(o) {
    var r = o.ratear;
    if (!r || !App.podeRegistrar() || !Store.tipoEvento('RATEIO')) return null;
    if (!r.pode) return r.motivo ? h('p', { class: 'suave', dataset: { naoRateia: '1' }, text: 'Não se rateia: ' + r.motivo }) : null;
    var l = o.lancamento, p = r.padrao;
    return h('div', { class: 'acoes' }, UI.botao(r.ja_rateado ? 'Ratear de novo' : 'Ratear entre os animais', { icone: 'registrar', atributos: { 'data-ratear': l.financial_id }, aoClicar: function () {
      var campos = { financial_id: l.financial_id };
      ['escopo_tipo', 'criterio', 'pasture_id', 'category_id'].forEach(function (k) { if (p[k]) campos[k] = p[k]; });
      var criterios = [];
      p.escopos.forEach(function (e) { (p.criterios[e] || []).forEach(function (c) { if (criterios.indexOf(c) < 0) criterios.push(c); }); });
      var rotulos = {};
      rotulos[l.financial_id] = nomeLancamento(l) + ' · ' + Fmt.dinheiro(l.valor) + ' (' + competencia(l) + ')';
      Registro.abrir('RATEIO', { campos: campos, rotulos: rotulos, opcoes: { escopo_tipo: p.escopos, criterio: criterios }, origem: 'financeiro/lancamento/' + l.financial_id });
    } }));
  }
  /** O rateio desatualizado (a base refeita hoje muda; Rateio.desatualizado): quem muda e o que a base era e passa a ser. */
  function avisoDesatualizado(d) {
    var mudancas = d.diferencas.slice(0, 8).map(function (x) {
      var nome = x.brinco || x.codigo_interno || 'animal';
      return nome + (x.gravada === null ? ' entra' : x.hoje === null ? ' sai' : ' (' + Fmt.numero(x.gravada, Fmt.casas(x.gravada)) + ' → ' + Fmt.numero(x.hoje, Fmt.casas(x.hoje)) + ')');
    });
    var texto = 'Rateio desatualizado: refeita hoje, a base muda' + (mudancas.length ? ': ' + mudancas.join(', ') + (d.diferencas.length > 8 ? ' e mais ' + (d.diferencas.length - 8) : '') : '') + '. ' +
      (d.problemas.length ? d.problemas.join(' ') + ' ' : '') + 'O valor de cada animal não muda sozinho: rateie de novo se quiser a base de hoje.';
    var n = UI.nota(texto, 'aviso');
    n.setAttribute('data-rateio-desatualizado', String(d.diferencas.length));
    return n;
  }

      try {
        var q = { visao: 'PASTOS' };
        if (filtrosPastos.de) q.de = filtrosPastos.de;
        if (filtrosPastos.data) q.data = filtrosPastos.data;
        var r = (await Cliente.consulta('financeiro.custosAnimal', q)).data;
        if (!vivo) return;
        Util.limpar(corpo);
        if (r.motivo) { corpo.appendChild(UI.nota(r.mensagem, 'info')); return; }
        var ind = h('div', { class: 'indicadores', role: 'list', dataset: { resumoPastos: '1' } });
        r.por_posse.forEach(function (p) {
          ind.appendChild(UI.indicador('Pastos ' + (p.posse === 'ARRENDADO' ? 'arrendados' : 'próprios'), Fmt.dinheiro(p.custo), p.pastos + (p.pastos === 1 ? ' pasto' : ' pastos') + ' · ' + p.animais_dia + ' animais-dia' + (p.custo_animal_dia === null ? '' : ' · ' + Fmt.dinheiro(p.custo_animal_dia) + ' por animal-dia'), 'posse-' + p.posse));
        });
        ind.appendChild(UI.indicador('Custeio sem pasto', Fmt.dinheiro(r.custeio_sem_pasto), 'os outros gastos do período (fora dos pastos)', 'sem-pasto'));
        corpo.appendChild(ind);
        corpo.appendChild(UI.nota('De ' + Fmt.data(r.de) + ' a ' + Fmt.data(r.ate) + '. O custo de cada pasto são os lançamentos com o pasto (manutenção, arrendamento), pela parte do período; "alocado" é o que já foi rateado entre os animais. Animais-dia: o dia da entrada conta, o da saída não.', 'info'));
        if (r.antes_do_marco_zero) corpo.appendChild(UI.nota('O período começa antes do marco zero: as contas começam nele.', 'info'));
        corpo.appendChild(UI.tabela({
          id: 'custos-pastos', rotulo: 'Custo por pasto', linhas: r.pastos, chave: function (p) { return p.pasture_id; },
          colunas: [
            { id: 'nome', rotulo: 'Pasto', formatar: function (p) { return link('pasto/' + p.pasture_id, p.nome); } },
            { id: 'posse', rotulo: 'Posse', valor: function (p) { return Fmt.rotulo('POSSE', p.posse) + (p.arrendador_nome ? ' de ' + p.arrendador_nome : ''); } },
            { id: 'area_hectares', rotulo: 'Área (ha)', num: true, formatar: function (p) { return p.area_hectares === null ? '—' : Fmt.numero(p.area_hectares, Fmt.casas(p.area_hectares)); } },
            { id: 'custo', rotulo: 'Custo no período', num: true, formatar: function (p) { return Fmt.dinheiro(p.custo); } },
            { id: 'alocado', rotulo: 'Alocado aos animais', num: true, formatar: function (p) { return Fmt.dinheiro(p.alocado); } },
            { id: 'nao_alocado', rotulo: 'Sem alocar', num: true, formatar: function (p) { return Fmt.dinheiro(p.nao_alocado); } },
            { id: 'animais_dia', rotulo: 'Animais-dia', num: true },
            { id: 'custo_ha', rotulo: 'Por hectare', num: true, valor: function (p) { return p.custo_ha.valor; }, formatar: function (p) { return UI.valorInd(p.custo_ha, Fmt.dinheiro).texto; } },
            { id: 'custo_animal_dia', rotulo: 'Por animal-dia', num: true, valor: function (p) { return p.custo_animal_dia.valor; }, formatar: function (p) { return UI.valorInd(p.custo_animal_dia, Fmt.dinheiro).texto; } },
          ], vazio: { texto: 'Nenhum pasto com custo ou animal no período.' },
        }).el);
        var lancs = [];
        r.pastos.forEach(function (p) { p.lancamentos.forEach(function (x) { lancs.push({ chave: p.pasture_id + ':' + x.financial_id, pasto: p.nome, x: x }); }); });
        if (lancs.length) {
          corpo.appendChild(UI.secao('Lançamentos dos pastos', UI.tabela({
            id: 'custos-pastos-lancamentos', rotulo: 'Lançamentos dos pastos no período', linhas: lancs, chave: function (l) { return l.chave; },
            colunas: [
              { id: 'pasto', rotulo: 'Pasto' },
              { id: 'lancamento', rotulo: 'Lançamento', valor: function (l) { return l.x.descricao || l.x.conta_nome; }, formatar: function (l) { return link('financeiro/lancamento/' + l.x.financial_id, l.x.descricao || l.x.conta_nome || 'lançamento'); } },
              { id: 'conta', rotulo: 'Conta', valor: function (l) { return l.x.conta_nome; } },
              { id: 'competencia', rotulo: 'Competência', valor: function (l) { return l.x.competencia_inicio ? Fmt.data(l.x.competencia_inicio) + ' a ' + Fmt.data(l.x.competencia_fim) : Fmt.data(l.x.data_competencia); } },
              { id: 'valor', rotulo: 'Valor do lançamento', num: true, valor: function (l) { return l.x.valor_lancamento; }, formatar: function (l) { return Fmt.dinheiro(l.x.valor_lancamento); } },
              { id: 'periodo', rotulo: 'No período', num: true, valor: function (l) { return l.x.valor_periodo; }, formatar: function (l) { return Fmt.dinheiro(l.x.valor_periodo); } },
              { id: 'alocado', rotulo: 'Alocado', num: true, valor: function (l) { return l.x.alocado_periodo; }, formatar: function (l) { return Fmt.dinheiro(l.x.alocado_periodo); } },
              { id: 'criterio', rotulo: 'Divisão', valor: function (l) { return l.x.criterio ? Fmt.rotulo('CRITERIO_RATEIO', l.x.criterio) + ' (' + Fmt.data(l.x.rateio_data) + ')' : 'sem rateio'; } },
            ],
          }).el, { dado: 'lancamentos-pastos' }));
        }
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
      }
    }
    carregar();
    return function () { vivo = false; };
  }

  Telas.registrar('financeiro/titulos', { titulo: 'A pagar e a receber', modulo: 'FINANCEIRO', montar: montarTitulos });
  Telas.registrar('financeiro/resultado', { titulo: 'Resultado', modulo: 'FINANCEIRO', montar: montarResultado });
  Telas.registrar('financeiro/custos', { titulo: 'Custo por animal', modulo: 'FINANCEIRO', montar: montarCustos });
  Telas.registrar('financeiro/custos/pastos', { titulo: 'Custo por pasto', modulo: 'FINANCEIRO', montar: montarCustosPastos });
  Telas.registrar('financeiro/fluxo', { titulo: 'Fluxo de caixa', modulo: 'FINANCEIRO', montar: montarFluxo });
  Telas.registrar('financeiro', { titulo: 'Financeiro', modulo: 'FINANCEIRO', montar: montarLista });
  Telas.registrar('financeiro/lancamentos', { titulo: 'Financeiro', modulo: 'FINANCEIRO', montar: montarLista });
  Telas.registrar('financeiro/lancamento/:id', { titulo: 'Lançamento financeiro', modulo: 'FINANCEIRO', montar: montarDetalhe });
  return { SITUACAO_PARCELA: SITUACAO_PARCELA, montarTitulos: montarTitulos, montarFluxo: montarFluxo, montarResultado: montarResultado, montarCustos: montarCustos, montarCustosPastos: montarCustosPastos };
})();
</script>
