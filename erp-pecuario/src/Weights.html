<script>
'use strict';
/*
 * ERP Pecuário — Pesagens (Fase 3, E3.1), carregada sob demanda (01, seção 6.2): a tela de desempenho (08, seção 3; 07,
 * seção 8.1: peso médio e GMD por pasto e por categoria, as pesagens com o GMD de lote, curvas de 2 a 5 animais com a
 * projeção rotulada) e o modo curral (08, seção 5; premissa PR-06: celular e sinal fraco).
 *
 * Modo curral: o operador digita na ordem em que o gado passa — brinco (teclado numérico), Enter, peso, Enter — e a linha
 * vai para a fila do aparelho (rascunho persistente: localStorage, ou o servidor quando ele falta, como todo rascunho). A
 * fila sai em blocos idempotentes: cada bloco é um lançamento PESAGEM com a sua chave, guardada no rascunho antes do envio;
 * sinal que cai no meio deixa o bloco "sem confirmação", e o reenvio com a mesma chave grava uma vez só (o servidor devolve
 * o resultado gravado). O aparelho só confere formato e acha o animal na lista dele; o ganho, a variação e o aviso de peso
 * fora do esperado são do servidor, que é a autoridade (P5): aparecem quando o bloco volta.
 */
var TelaPesagens = (function () {
  var h = Util.h;
  var ID_RASCUNHO = 'curral-pesagem';
  var TIPO_RASCUNHO = 'CURRAL_PESAGEM';
  /** Pesagens por bloco: um lançamento por bloco; o bloco cheio sai sozinho quando não há pendência. */
  var BLOCO = 20;
  var PESO_MAX = 2000;
  var MOMENTOS = ['ROTINA', 'ENTRADA', 'DESMAMA', 'VENDA'];
  var METODOS = ['BALANCA', 'FITA', 'ESTIMATIVA_VISUAL'];
  var filtros = { de: '', ate: '', pasture_id: '', sexo: '', category_id: '', raca: '', animais: [] };

  function opcoes(lista, atual, vazio) {
    return (vazio ? [h('option', { value: '', text: vazio })] : []).concat(lista.map(function (x) { return h('option', { value: x[0], text: x[1], selected: x[0] === atual }); }));
  }
  function campo(id, rotulo, controle, ajuda) {
    return h('div', { class: 'campo' }, h('label', { class: 'campo-rotulo', for: id, text: rotulo }), controle, ajuda ? h('p', { class: 'campo-ajuda', text: ajuda }) : null);
  }
  function kg(v) { return v === null || v === undefined ? '—' : Fmt.peso(v); }
  function gmdTexto(v) { return v === null || v === undefined ? '—' : Fmt.numero(v, 3) + ' kg/dia'; }
  function semValor(ind) { return '— (' + ((ind && ind.explicacao) || Fmt.rotulo('MOTIVO', (ind && ind.motivo) || 'DADOS_INSUFICIENTES')) + ')'; }
  function linkEvento(id, texto) { var r = 'evento/' + id; return h('a', { class: 'botao botao-texto', href: Roteador.href(r), dataset: { rota: r } }, texto); }
  function linkAnimal(id, texto) { var r = 'animal/' + id + '/peso'; return h('a', { class: 'botao botao-texto', href: Roteador.href(r), dataset: { rota: r } }, texto); }
  function nomeDe(id) { var a = Store.animal(id); return a ? Store.rotuloAnimal(a) : 'animal'; }

  // ------------------------------------------------------------------ desempenho ----
  function cartaoIndicadores(geral, ate) {
    var pm = geral.peso_medio || {};
    var g = geral.gmd || {};
    return h('div', { class: 'indicadores', role: 'list', dataset: { indicadoresPeso: '1' } },
      UI.indicador('Cabeças em ' + Fmt.dataCurta(ate), geral.cabecas === null || geral.cabecas === undefined ? '—' : Fmt.numero(geral.cabecas), geral.motivo ? Fmt.rotulo('MOTIVO', geral.motivo) : null, 'cabecas'),
      UI.indicador('Peso médio', pm.valor === null || pm.valor === undefined ? '—' : Fmt.peso(pm.valor), pm.valor === null || pm.valor === undefined ? Fmt.rotulo('MOTIVO', pm.motivo || 'DADOS_INSUFICIENTES') : pm.pct_estimado ? Fmt.numero(pm.pct_estimado, 1) + '% estimado' : 'pesado', 'peso-medio'),
      UI.indicador('Ganho médio diário', g.valor === null || g.valor === undefined ? '—' : gmdTexto(g.valor), g.valor === null || g.valor === undefined ? (g.explicacao || Fmt.rotulo('MOTIVO', g.motivo || 'DADOS_INSUFICIENTES')) : g.n + (g.n === 1 ? ' animal' : ' animais') + ', ' + Fmt.numero(g.dias) + ' dias somados', 'gmd'));
  }
  function tabelaGrupos(id, rotulo, linhas, nomeCol) {
    return UI.tabela({ id: id, rotulo: rotulo, linhas: linhas, chave: function (x) { return (x.pasture_id || x.category_id || 'sem') + x.nome; },
      colunas: [
        { id: 'nome', rotulo: nomeCol, valor: function (x) { return x.rotulo || x.nome || '—'; } },
        { id: 'cabecas', rotulo: 'Cabeças', num: true, valor: function (x) { return x.cabecas === null ? null : x.cabecas; }, formatar: function (x) { return x.cabecas === null ? '—' : String(x.cabecas); } },
        { id: 'peso_medio', rotulo: 'Peso médio', num: true, valor: function (x) { return x.peso_medio ? x.peso_medio.valor : null; }, formatar: function (x) { var p = x.peso_medio || {}; return p.valor === null || p.valor === undefined ? '—' : Fmt.peso(p.valor) + (p.pct_estimado ? ' (' + Fmt.numero(p.pct_estimado, 1) + '% estimado)' : ''); } },
        { id: 'gmd', rotulo: 'Ganho médio diário', num: true, valor: function (x) { return x.gmd ? x.gmd.valor : null; }, formatar: function (x) { var g = x.gmd || {}; return g.valor === null || g.valor === undefined ? '— (' + (g.n || 0) + (g.n === 1 ? ' animal)' : ' animais)') : gmdTexto(g.valor) + ' (' + g.n + ')'; } },
      ] }).el;
  }
  // Gráficos (SP-08, Components): os números são os do servidor, os mesmos das tabelas; o "—" leva o porquê do servidor.
  function pontoGmd(x, g) { return { x: x, y: g ? g.valor : null, nota: g && g.valor === null ? g.explicacao || Fmt.rotulo('MOTIVO', g.motivo || 'DADOS_INSUFICIENTES') : null }; }
  function graficoGmd(titulo, rotuloX, linhas, dado, nMin) {
    return UI.grafico({ tipo: 'barras', titulo: titulo, rotuloX: rotuloX, rotuloValor: 'Ganho médio diário (kg/dia)', formatar: gmdTexto, dado: dado,
      vazio: 'Sem ganho médio diário: é preciso ao menos ' + nMin + ' animais com duas pesagens individuais no período.',
      series: [{ nome: 'Ganho médio diário', pontos: linhas.map(function (x) { return pontoGmd(x.rotulo || x.nome || '—', x.gmd); }) }] });
  }
  /**
   * Rebanho por categoria em cada pasto no fim do período (barras empilhadas; o total de cada pasto é o do servidor). O item
   * é o rótulo do servidor (único: o nome repetido em outra propriedade leva a propriedade), nunca só o nome.
   */
  function graficoCategorias(d) {
    var cats = [];
    var rot = function (p) { return p.rotulo || p.nome; };
    d.por_pasto.forEach(function (p) { (p.por_categoria || []).forEach(function (c) { if (cats.indexOf(c.nome) < 0) cats.push(c.nome); }); });
    var totais = {};
    d.por_pasto.forEach(function (p) { totais[rot(p)] = p.cabecas; });
    var series = cats.map(function (nome) {
      return { nome: nome, pontos: d.por_pasto.map(function (p) { var c = (p.por_categoria || []).filter(function (x) { return x.nome === nome; })[0]; return { x: rot(p), y: c ? c.cabecas : 0 }; }) };
    });
    if (d.por_pasto.some(function (p) { return p.sem_categoria; })) series.push({ nome: 'Sem categoria', pontos: d.por_pasto.map(function (p) { return { x: rot(p), y: p.sem_categoria || 0 }; }) });
    return UI.grafico({ tipo: 'empilhadas', titulo: 'Rebanho por categoria em cada pasto em ' + Fmt.data(d.periodo.ate), rotuloX: 'Pasto', rotuloValor: 'Cabeças', totais: totais, series: series, dado: 'rebanho-categorias',
      vazio: d.geral.motivo ? Fmt.rotulo('MOTIVO', d.geral.motivo) : 'Nenhum animal no rebanho no fim do período.' });
  }
  /** G5 (07, seção 9): a média mensal das pesagens individuais; o mês com poucas pesagens fica "—", com o porquê. */
  function graficoEvolucao(d) {
    return UI.grafico({ tipo: 'linha', titulo: 'Peso médio das pesagens de cada mês', rotuloX: 'Mês', rotuloValor: 'Peso médio (kg)', formatar: kg, dado: 'evolucao-peso',
      vazio: 'Nenhum mês do período com ao menos ' + d.parametros.n_minimo + ' pesagens individuais.',
      series: [{ nome: 'Peso médio', pontos: (d.evolucao || []).map(function (m) { return { x: m.mes.slice(5, 7) + '/' + m.mes.slice(0, 4), y: m.valor, nota: m.explicacao }; }) }] });
  }
  function graficoLotes(lista) {
    return UI.grafico({ tipo: 'barras', titulo: 'Ganho médio diário de cada pesagem de lote', rotuloX: 'Pesagem', rotuloValor: 'Ganho médio diário (kg/dia)', formatar: gmdTexto, dado: 'gmd-lote',
      vazio: 'Nenhuma pesagem do período tem uma anterior com os mesmos animais e o intervalo mínimo para o ganho de lote.',
      series: [{ nome: 'Ganho do lote', pontos: rotulosDosLotes(lista.slice().reverse()) }] });
  }
  /**
   * Um item por lançamento (o item é a chave das barras): dois lançamentos no mesmo dia — os blocos do curral — ganham o
   * número e o tamanho no rótulo, para nenhum ganho de lote sumir do gráfico nem da tabela dele.
   */
  function rotulosDosLotes(lista) {
    var vistos = {};
    return lista.map(function (x) {
      var mesmos = lista.filter(function (y) { return y.data === x.data; }).length;
      vistos[x.data] = (vistos[x.data] || 0) + 1;
      return pontoGmd(Fmt.data(x.data) + (mesmos > 1 ? ' (lançamento ' + vistos[x.data] + ' de ' + mesmos + ', ' + x.n + (x.n === 1 ? ' animal' : ' animais') + ')' : ''), x.gmd_lote);
    });
  }
  function blocoPesagens(lista) {
    if (!lista.length) return UI.nota('Nenhuma pesagem no período.', 'info');
    return UI.tabela({ id: 'pesagens-periodo', rotulo: 'Pesagens do período', linhas: lista, chave: function (x) { return x.event_id; },
      colunas: [
        { id: 'data', rotulo: 'Data', valor: function (x) { return x.data; }, formatar: function (x) { return linkEvento(x.event_id, Fmt.data(x.data)); } },
        { id: 'n', rotulo: 'Animais', num: true },
        { id: 'media', rotulo: 'Média', num: true, valor: function (x) { return x.media_kg; }, formatar: function (x) { return kg(x.media_kg); } },
        { id: 'como', rotulo: 'Como', valor: function (x) { return (x.lote ? 'Lote: ' + Fmt.peso(x.lote.total_kg) + ' ÷ ' + x.lote.cabecas : Fmt.rotulo('METODO_PESAGEM', x.metodo)) + ' · ' + Fmt.rotulo('TIPO_PESAGEM', x.tipo) + (x.jejum ? ' · jejum' : ''); } },
        { id: 'gmd_lote', rotulo: 'GMD do lote', num: true, valor: function (x) { return x.gmd_lote ? x.gmd_lote.valor : null; }, formatar: function (x) {
          var g = x.gmd_lote || {};
          return g.valor === null || g.valor === undefined ? semValor(g) : gmdTexto(g.valor) + ' desde ' + Fmt.dataCurta(g.comparada_com.data) + ' (' + g.n + ' em comum)';
        } },
      ] }).el;
  }
  function blocoCurvas(d, aoMudar) {
    var caixa = h('div', { dataset: { curvas: '1' } });
    var entrada = h('input', { type: 'search', id: 'curva-brinco', autocomplete: 'off', inputmode: 'numeric', placeholder: 'Brinco', 'aria-describedby': 'curva-ajuda' });
    var form = h('form', { class: 'filtros', 'aria-label': 'Curvas de peso', on: { submit: async function (ev) {
      ev.preventDefault();
      var r;
      try { r = await Store.buscar(entrada.value, null, function (a) { return a.situacao_cadastral !== 'EXTERNO'; }); } catch (e) { UI.aviso(Store.semResposta(e), { tipo: 'erro' }); return; }
      // O brinco inteiro de uma vaca acha a vaca: as crias sem brinco que a busca junta só valem quando não há brinco exato.
      if (r.mae && r.modo !== 'CRIAS') r = { candidatos: [r.mae] };
      if (r.candidatos.length !== 1) { UI.aviso(r.candidatos.length ? 'Mais de um animal com "' + entrada.value + '": digite o brinco inteiro.' : r.mensagem || 'Nenhum animal com "' + entrada.value + '".', { tipo: 'erro' }); return; }
      if (filtros.animais.indexOf(r.candidatos[0].animal_id) < 0) filtros.animais = filtros.animais.concat([r.candidatos[0].animal_id]).slice(-5);
      aoMudar();
    } } }, campo('curva-brinco', 'Comparar a curva de até 5 animais', entrada), UI.botao('Mostrar', { atributos: { type: 'submit' } }));
    caixa.appendChild(form);
    caixa.appendChild(h('p', { class: 'campo-ajuda', id: 'curva-ajuda', text: 'A linha cheia liga os pesos medidos; a tracejada é a estimativa pelo ganho recente, nunca um peso pesado.' }));
    if (!d.curvas.length) return caixa;
    caixa.appendChild(h('ul', { class: 'lista-simples' }, d.curvas.map(function (c) {
      return h('li', { class: 'linha-acao' }, linkAnimal(c.animal_id, c.brinco || c.codigo_interno), UI.botao('Tirar da comparação', { tipo: 'texto', aoClicar: function () { filtros.animais = filtros.animais.filter(function (x) { return x !== c.animal_id; }); aoMudar(); } }));
    })));
    caixa.appendChild(UI.curvaPeso({ titulo: 'Curvas de peso', series: d.curvas.map(function (c) {
      return { nome: c.brinco || c.codigo_interno, pontos: c.serie.map(function (x) { return { data: x.data, peso_kg: x.peso_kg, estimado: x.estimado }; }), nascer: c.ponto_nascer_estimado, projecao: c.projecao && c.projecao.valor ? c.projecao : null };
    }) }));
    return caixa;
  }
  function tabelaAnimais(lista) {
    if (!lista.length) return UI.nota('Nenhum animal pesado no período com estes filtros.', 'info');
    return UI.tabela({ id: 'animais-peso', rotulo: 'Animais pesados no período', linhas: lista, chave: function (x) { return x.animal_id; },
      colunas: [
        { id: 'brinco', rotulo: 'Animal', valor: function (x) { return x.brinco || x.codigo_interno; }, formatar: function (x) { return linkAnimal(x.animal_id, x.brinco || x.codigo_interno); } },
        { id: 'pesagens', rotulo: 'Pesagens', num: true },
        { id: 'ultima', rotulo: 'Última', valor: function (x) { return x.ultima ? x.ultima.data : null; }, formatar: function (x) { return x.ultima ? Fmt.peso(x.ultima.peso_kg) + ' em ' + Fmt.data(x.ultima.data) + (x.ultima.estimado ? ' (estimado)' : '') : '—'; } },
        { id: 'ganho', rotulo: 'Ganho', num: true, valor: function (x) { return x.ganho_kg; }, formatar: function (x) { return x.ganho_kg === null ? '—' : Fmt.numero(x.ganho_kg, 1) + ' kg em ' + x.dias + ' dias'; } },
        { id: 'gmd', rotulo: 'Ganho médio diário', num: true, valor: function (x) { return x.gmd ? x.gmd.valor : null; }, formatar: function (x) { return x.gmd && x.gmd.valor !== null ? gmdTexto(x.gmd.valor) : '—'; } },
      ] }).el;
  }
  function montarDesempenho(el) {
    var vivo = true;
    el.appendChild(h('div', { class: 'tela-cabecalho' }, h('h1', { text: 'Pesagens' }),
      h('div', { class: 'acoes', style: 'margin-top:0' },
        h('a', { class: 'botao botao-primario', href: Roteador.href('pesagens/curral'), dataset: { rota: 'pesagens/curral' } }, 'Pesar no curral'),
        App.podeRegistrar() && Store.tipoEvento('PESAGEM') ? h('a', { class: 'botao botao-secundario', href: Roteador.href('evento/novo/PESAGEM'), dataset: { rota: 'evento/novo/PESAGEM' } }, 'Pesagem pelo formulário (lote, colar)') : null)));
    var pend = h('div');
    el.appendChild(pend);
    Rascunhos.obter(ID_RASCUNHO).then(function (r) {
      if (!vivo || !r || !r.linhas || !r.linhas.length) return;
      pend.appendChild(UI.nota('Pesagem no curral de ' + Fmt.data(r.sessao.data) + ' não concluída (' + r.linhas.length + (r.linhas.length === 1 ? ' animal' : ' animais') + ').', 'aviso'));
      pend.appendChild(h('a', { class: 'botao botao-secundario', href: Roteador.href('pesagens/curral'), dataset: { rota: 'pesagens/curral' } }, 'Continuar a pesagem no curral'));
    }, function (e) { pend.appendChild(UI.nota('Não foi possível ler o rascunho do curral: ' + e.message, 'aviso')); });
    var de = h('input', { type: 'date', id: 'pd-de', value: filtros.de });
    var ate = h('input', { type: 'date', id: 'pd-ate', value: filtros.ate });
    var pasto = h('select', { id: 'pd-pasto' }, opcoes(Store.pastos({ todos: true }).map(function (p) { return [p.pasture_id, p.nome]; }), filtros.pasture_id, 'Todos'));
    var sexo = h('select', { id: 'pd-sexo' }, opcoes([['M', 'Machos'], ['F', 'Fêmeas']], filtros.sexo, 'Machos e fêmeas'));
    var cat = h('select', { id: 'pd-cat' }, opcoes(Store.categorias().map(function (c) { return [c.category_id, c.nome]; }), filtros.category_id, 'Todas'));
    var raca = h('select', { id: 'pd-raca' }, opcoes(Store.lista('RACA').map(function (x) { return [x.codigo, x.rotulo]; }), filtros.raca, 'Todas'));
    el.appendChild(h('form', { class: 'filtros', role: 'search', 'aria-label': 'Filtrar o desempenho', on: { submit: function (ev) {
      ev.preventDefault();
      filtros.de = de.value; filtros.ate = ate.value; filtros.pasture_id = pasto.value; filtros.sexo = sexo.value; filtros.category_id = cat.value; filtros.raca = raca.value;
      carregar();
    } } }, campo('pd-de', 'De', de), campo('pd-ate', 'Até', ate), campo('pd-pasto', 'Pasto', pasto), campo('pd-sexo', 'Sexo', sexo), campo('pd-cat', 'Categoria', cat), campo('pd-raca', 'Raça', raca),
      UI.botao('Atualizar', { tipo: 'primario', atributos: { type: 'submit' } })));
    var corpo = h('div', { dataset: { desempenho: '1' } }, UI.carregando('Calculando o desempenho…'));
    el.appendChild(corpo);
    async function carregar() {
      Util.limpar(corpo);
      corpo.appendChild(UI.carregando('Calculando o desempenho…'));
      var dados = {};
      ['de', 'ate', 'pasture_id', 'sexo', 'category_id', 'raca'].forEach(function (k) { if (filtros[k]) dados[k] = filtros[k]; });
      if (filtros.animais.length) dados.animais = filtros.animais.slice();
      var d;
      try {
        d = (await Cliente.consulta('peso.desempenho', dados)).data;
      } catch (e) {
        if (!vivo) return;
        Util.limpar(corpo);
        corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: carregar } }));
        return;
      }
      if (!vivo) return;
      Util.limpar(corpo);
      corpo.appendChild(h('p', { class: 'dado', role: 'status', text: 'Período: ' + (d.periodo.de ? Fmt.data(d.periodo.de) : 'desde o início') + ' a ' + Fmt.data(d.periodo.ate) + '. Ganho médio diário só entre pesagens de balança' + (d.parametros.aceita_fita ? ' ou fita' : '') + ' com ao menos ' + d.parametros.intervalo_min_dias + ' dias, e grupos com ao menos ' + d.parametros.n_minimo + ' animais.' }));
      corpo.appendChild(cartaoIndicadores(d.geral, d.periodo.ate));
      var nMin = d.parametros.n_minimo;
      corpo.appendChild(UI.secao('Evolução do peso', graficoEvolucao(d), { dado: 'evolucao' }));
      corpo.appendChild(UI.secao('Por pasto', d.por_pasto.length ? h('div', null, graficoGmd('Ganho médio diário por pasto', 'Pasto', d.por_pasto, 'gmd-pasto', nMin), graficoCategorias(d), tabelaGrupos('peso-pastos', 'Peso e ganho por pasto', d.por_pasto, 'Pasto')) : UI.nota('Sem dados por pasto.', 'info'), { dado: 'por-pasto' }));
      corpo.appendChild(UI.secao('Por categoria', d.por_categoria.length ? h('div', null, graficoGmd('Ganho médio diário por categoria', 'Categoria', d.por_categoria, 'gmd-categoria', nMin), tabelaGrupos('peso-categorias', 'Peso e ganho por categoria', d.por_categoria, 'Categoria')) : UI.nota('Sem dados por categoria.', 'info'), { dado: 'por-categoria' }));
      corpo.appendChild(UI.secao('Pesagens e ganho de lote', d.pesagens.length ? h('div', null, graficoLotes(d.pesagens), blocoPesagens(d.pesagens)) : blocoPesagens(d.pesagens), { dado: 'pesagens' }));
      corpo.appendChild(UI.secao('Curvas de peso', blocoCurvas(d, carregar), { dado: 'curvas' }));
      corpo.appendChild(UI.secao('Animais', tabelaAnimais(d.animais), { dado: 'animais-peso' }));
    }
    carregar();
    return function () { vivo = false; };
  }

  // ------------------------------------------------------------------ modo curral ----
  var curral = null;
  function novaSessao() {
    return { tipo: TIPO_RASCUNHO, rotulo: 'Pesagem no curral', estado: 'EDITANDO', data: Fmt.hoje(), n: 0, iniciada: false,
      sessao: { data: Fmt.hoje(), metodo: 'BALANCA', momento: 'ROTINA', jejum: false, pasto_id: '' }, linhas: [], blocos: [], seq: 0 };
  }
  async function carregarSessao() {
    if (curral) return curral;
    var r = await Rascunhos.obter(ID_RASCUNHO);
    curral = r && r.tipo === TIPO_RASCUNHO ? r : novaSessao();
    return curral;
  }
  /** O rascunho a cada linha: imediato antes de um envio (a chave do bloco precisa estar guardada antes de sair). */
  function guardar(c, o) {
    c.n = c.linhas.length;

      c.linhas.forEach(function (x) { if (x.bloco === b.chave && x.estado === 'AVISO' && !(x.avisosProprios || []).length) { x.estado = 'FILA'; x.mensagem = 'Confirmado por você: sai no próximo envio.'; } });
      reenviarSeAceito(b);
    }
    function reenviarSeAceito(b) {
      var faltam = c.linhas.filter(function (x) { return x.bloco === b.chave && x.estado === 'AVISO'; });
      if (!faltam.length && (!(b.gerais || []).length || b.geralAceito)) { b.reenviar = true; mudou(); enviarAgora(); return; }
      mudou();
    }
    function corrigirPeso(l) {
      var entrada = h('input', { type: 'text', inputmode: 'decimal', id: 'cur-corrige', value: Fmt.numero(l.peso, 1).replace(/\./g, '') });
      var f = UI.folha({ titulo: 'Peso de ' + (l.animal_id ? nomeDe(l.animal_id) : l.brinco), conteudo: campo('cur-corrige', 'Peso (kg)', entrada), acoes: [] });
      f.definirAcoes([UI.botao('Voltar', { aoClicar: function () { f.fechar(); } }), UI.botao('Corrigir', { tipo: 'primario', aoClicar: function () {
        var p = Fmt.lerDecimal(entrada.value, 1);
        if (p.erro || !(p.valor > 0) || p.valor > PESO_MAX) { UI.aviso(p.erro || 'O peso vai de 0,1 a 2.000 kg.', { tipo: 'erro' }); return; }
        if (l.bloco) desfazerBloco(c, l.bloco);
        l.peso = p.valor;
        l.estado = 'FILA';
        l.mensagem = null;
        f.fechar({ forcar: true });
        mudou();
      } })]);
      entrada.focus();
    }
    function corrigirBrinco(l) {
      var entrada = h('input', { type: 'text', inputmode: 'numeric', id: 'cur-corrige-brinco', value: l.brinco || '' });
      var f = UI.folha({ titulo: 'Brinco da pesagem de ' + Fmt.peso(l.peso), conteudo: campo('cur-corrige-brinco', 'Brinco', entrada), acoes: [] });
      f.definirAcoes([UI.botao('Voltar', { aoClicar: function () { f.fechar(); } }), UI.botao('Corrigir', { tipo: 'primario', aoClicar: async function () {
        // A mesma conferência do brinco digitado: o resolvedor único do servidor na data da pesagem (presença e pasto naquele dia).
        var t = entrada.value.trim();
        var r = await resolverNoServidor([t]);
        if (r.erro) { UI.aviso('Sem resposta do servidor (' + r.erro.message + '): o brinco é conferido por ele. Corrija com sinal.', { tipo: 'erro' }); return; }
        var x = r.porTexto[t];
        if (x.situacao !== 'ACHADO') { UI.aviso(x.mensagem, { tipo: 'erro' }); return; }
        var a = Store.doEstado(r.animais[x.animal_id]);
        if (!presente(a)) { UI.aviso(Store.rotuloAnimal(a) + ' ' + motivoFora(a) + ': não entra na pesagem.', { tipo: 'erro' }); return; }
        l.brinco = brincoDe(a) || a.codigo_interno; l.texto = t; l.animal_id = a.animal_id; l.dataAnimal = c.sessao.data; l.estado = 'FILA'; l.mensagem = null; l.semPosicao = false;
        l.fora = !!(c.sessao.pasto_id && pastoDe(a) !== c.sessao.pasto_id);
        f.fechar({ forcar: true });
        mudou();
      } })]);
      entrada.focus();
    }
    async function terminar_() {
      var naoGravadas = c.linhas.filter(function (l) { return l.estado !== 'GRAVADA'; });
      if (naoGravadas.length) {
        var incertas = naoGravadas.filter(function (l) { return l.estado === 'SEM_SINAL' || l.estado === 'ENVIANDO'; }).length;
        if (incertas) { UI.aviso(incertas + (incertas === 1 ? ' pesagem ainda não teve' : ' pesagens ainda não tiveram') + ' confirmação do servidor: envie de novo com sinal antes de terminar.', { tipo: 'aviso' }); return; }
        var ok = await UI.confirmar({ titulo: 'Terminar sem enviar tudo?', texto: naoGravadas.length + (naoGravadas.length === 1 ? ' pesagem não foi gravada e será descartada.' : ' pesagens não foram gravadas e serão descartadas.'), verbo: 'Descartar e terminar', cancelar: 'Voltar', perigo: true });
        if (!ok) return;
      }
      var gravados = c.blocos.filter(function (b) { return b.estado === 'GRAVADO'; });
      await Rascunhos.remover(ID_RASCUNHO).catch(function (e) { Util.registrarFalha('remover o rascunho do curral', e); });
      var resumo = { gravadas: c.linhas.filter(function (l) { return l.estado === 'GRAVADA'; }).length, blocos: gravados.map(function (b) { return { event_id: b.event_id, n: b.n, media_kg: b.media_kg }; }), data: c.sessao.data };
      curral = null;
      mostrarResultado(resumo);
    }
    function mostrarResultado(r) {
      Util.limpar(corpo);
      titulo.textContent = 'Pesagem concluída';
      corpo.appendChild(h('div', { class: 'estado estado-ok', dataset: { resultadoCurral: String(r.gravadas) } },
        h('p', { class: 'resultado-numero', text: r.gravadas + (r.gravadas === 1 ? ' pesagem gravada' : ' pesagens gravadas') + ' em ' + Fmt.data(r.data) + (r.blocos.length > 1 ? ', em ' + r.blocos.length + ' lançamentos' : '') + '.' }),
        h('ul', { class: 'lista-simples' }, r.blocos.map(function (b, i) { return h('li', null, linkEvento(b.event_id, 'Lançamento ' + (i + 1) + ': ' + b.n + (b.n === 1 ? ' animal' : ' animais') + ', média ' + Fmt.peso(b.media_kg))); })),
        h('div', { class: 'acoes' }, h('a', { class: 'botao botao-primario', href: Roteador.href('pesagens'), dataset: { rota: 'pesagens' } }, 'Ver o desempenho'), UI.botao('Nova pesagem no curral', { aoClicar: function () { Roteador.ir('pesagens/curral', { forcar: true }); } }))));
    }
    function montarSessao() {
      Util.limpar(corpo);
      if (!c.iniciada) { formularioInicio(corpo, c, montarSessao); return; }
      var s = c.sessao;
      titulo.textContent = 'Pesagem no curral';
      ui.estados = {};
      ui.contador = h('div', { class: 'curral-contador', role: 'status', 'aria-live': 'polite' });
      ui.mudar = h('div', { dataset: { curralMudar: '1' } });
      var cab = h('div', { class: 'curral-cabecalho', dataset: { curralCabecalho: '1' } },
        h('p', { class: 'dado', text: Fmt.data(s.data) + ' · ' + Fmt.rotulo('METODO_PESAGEM', s.metodo) + ' · ' + Fmt.rotulo('TIPO_PESAGEM', s.momento) + (s.jejum ? ' · jejum' : '') + (s.pasto_id ? ' · ' + ((Store.pasto(s.pasto_id) || {}).nome || '') : '') }),
        ui.posicaoNota = h('div', { dataset: { curralPosicao: '1' } }),
        ui.contador,
        ui.mudar);
      ui.brinco = h('input', { type: 'text', id: 'cur-brinco', class: 'curral-entrada', inputmode: 'numeric', autocomplete: 'off', enterkeyhint: 'next', 'aria-describedby': 'cur-conferencia' });
      ui.peso = h('input', { type: 'text', id: 'cur-peso', class: 'curral-entrada', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'done' });
      ui.brinco.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); if (conferir()) ui.peso.focus(); } });
      ui.brinco.addEventListener('input', function () { ui.atual = null; ui.conferindo = null; ui.vezConf = (ui.vezConf || 0) + 1; });
      ui.peso.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); lancar(); } });
      var teclado = UI.botao('Brinco com letras', { tipo: 'texto', atributos: { 'aria-pressed': 'false' }, aoClicar: function (ev) {
        var letras = ui.brinco.getAttribute('inputmode') === 'numeric';
        ui.brinco.setAttribute('inputmode', letras ? 'text' : 'numeric');
        ev.currentTarget.setAttribute('aria-pressed', String(letras));
        ui.brinco.focus();
      } });
      ui.conferencia = h('div', { id: 'cur-conferencia', role: 'status', 'aria-live': 'polite', class: 'curral-conferencia' });
      ui.candidatos = h('div', { class: 'curral-candidatos' });
      ui.faltam = h('div');
      ui.status = h('div', { class: 'curral-status', dataset: { curralStatus: '1' } });
      ui.lista = h('ol', { class: 'curral-lista', reversed: true, 'aria-label': 'Pesagens desta sessão (a mais recente primeiro)' });
      corpo.appendChild(cab);
      corpo.appendChild(h('form', { class: 'curral-form', novalidate: true, on: { submit: function (ev) { ev.preventDefault(); lancar(); } } },
        h('div', { class: 'curral-campos' }, campo('cur-brinco', 'Brinco', ui.brinco), campo('cur-peso', 'Peso (kg)', ui.peso)),
        teclado, ui.conferencia, ui.candidatos,
        h('div', { class: 'acoes' }, UI.botao('Próximo animal', { tipo: 'primario', atributos: { type: 'submit', 'data-proximo': '1' } }))));
      corpo.appendChild(ui.status);
      corpo.appendChild(ui.faltam);
      corpo.appendChild(ui.lista);
      carregarPosicao();
      desenhar();
      ui.brinco.focus();
      resolverEsperando();
      if (c.blocos.some(function (b) { return b.estado === 'ENVIANDO' || b.estado === 'SEM_SINAL'; })) conferirBlocos(c, desenhar).catch(function (e) { Util.registrarFalha('conferir os blocos do curral', e); });
    }
    carregarSessao().then(function (x) {
      if (!vivo) return;
      c = x;
      montarSessao();
    }, function (e) {
      if (!vivo) return;
      Util.limpar(corpo);
      corpo.appendChild(UI.estadoErro(e, { acao: { texto: 'Tentar de novo', aoClicar: function () { Roteador.ir('pesagens/curral', { forcar: true, substituir: true }); } } }));
    });
    return function () { vivo = false; ui = {}; };
  }

  Telas.registrar('pesagens', { titulo: 'Pesagens', modulo: 'PESAGENS', montar: montarDesempenho });
  Telas.registrar('pesagens/curral', { titulo: 'Pesagem no curral', modulo: 'PESAGENS', telaCheia: true, montar: montarCurral });
  return {
    BLOCO: BLOCO, ID_RASCUNHO: ID_RASCUNHO, TIPO_RASCUNHO: TIPO_RASCUNHO,
    sessao: function () { return curral ? Util.clonar(curral) : null; },
    esquecer: function () { curral = null; },
  };
})();
</script>
